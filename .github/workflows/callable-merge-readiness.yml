name: Callable Merge Readiness

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      repository:
        required: true
        type: string

permissions:
  statuses: write

jobs:
  set-status:
    name: publish merge-readiness status
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate merge readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          context="merge-readiness/e0da"
          head_sha="${HEAD_SHA}"
          pr_url="https://github.com/${GH_REPO}/pull/${PR_NUMBER}"
          state="success"
          description="Merge readiness is informational."
          gh api \
            --method POST \
            "repos/${GH_REPO}/statuses/${head_sha}" \
            -f context="${context}" \
            -f state="${state}" \
            -f description="${description}" \
            -f target_url="${pr_url}"
          echo "Set ${context}=${state} for ${pr_url}"
