name: CI TypeScript (Bun)

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for the TypeScript/Bun job."
        required: false
        type: string
        default: ubuntu-latest
      bun-version:
        description: "Bun version passed to oven-sh/setup-bun."
        required: false
        type: string
        default: latest
      system-deps:
        description: "Optional space-delimited Debian package names installed before dependencies and checks."
        required: false
        type: string
        default: ""
      env:
        description: "Optional newline-delimited KEY=VALUE entries exported before commands run."
        required: false
        type: string
        default: ""
      format-command:
        description: "Optional format-check command. When empty, runs package.json format:check if present."
        required: false
        type: string
        default: ""
      lint-command:
        description: "Optional lint command. When empty, runs package.json lint if present."
        required: false
        type: string
        default: ""
      build-command:
        description: "Optional build command. When empty, runs package.json build if present."
        required: false
        type: string
        default: ""
      check-command:
        description: "Optional type-check command. When empty, runs package.json check if present."
        required: false
        type: string
        default: ""
      test-command:
        description: "Optional test command. When empty, runs bun test."
        required: false
        type: string
        default: ""
      playwright-browser:
        description: "Optional Playwright payload: chromium, firefox, or webkit."
        required: false
        type: string
        default: ""
jobs:
  build-and-test:
    name: Format / Lint / Build / Check / Test
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        if: ${{ inputs.system-deps != '' }}
        env:
          SYSTEM_DEPS: ${{ inputs.system-deps }}
        run: |
          if [[ -z "$SYSTEM_DEPS" ]]; then
            exit 0
          fi

          read -r -a packages <<< "$SYSTEM_DEPS"
          for package in "${packages[@]}"; do
            if [[ ! "$package" =~ ^[a-z0-9][a-z0-9+.-]*$ ]]; then
              echo "invalid Debian package name: $package" >&2
              exit 1
            fi
          done

          if ! command -v apt-get >/dev/null 2>&1; then
            echo "system-deps requires a Debian or Ubuntu runner with apt-get" >&2
            exit 1
          fi

          apt=(apt-get)
          if [[ "$(id -u)" -ne 0 ]]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "system-deps requires root or passwordless sudo" >&2
              exit 1
            fi
            apt=(sudo apt-get)
          fi

          "${apt[@]}" update -q
          "${apt[@]}" install -y --no-install-recommends -- "${packages[@]}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export CI environment
        env:
          CI_ENV: ${{ inputs.env }}
        run: echo "$CI_ENV" >> "$GITHUB_ENV"

      - name: Check formatting
        env:
          FORMAT_COMMAND: ${{ inputs.format-command }}
        run: |
          if [[ -n "$FORMAT_COMMAND" ]]; then
            bash -lc "$FORMAT_COMMAND"
          elif bun -e 'const p = await Bun.file("package.json").json(); process.exit(p.scripts?.["format:check"] ? 0 : 1);'; then
            bun run format:check
          else
            echo "No format:check script; skipping"
          fi

      - name: Lint
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: |
          if [[ -n "$LINT_COMMAND" ]]; then
            bash -lc "$LINT_COMMAND"
          elif bun -e 'const p = await Bun.file("package.json").json(); process.exit(p.scripts?.["lint"] ? 0 : 1);'; then
            bun run lint
          else
            echo "No lint script; skipping"
          fi

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          if [[ -n "$BUILD_COMMAND" ]]; then
            bash -lc "$BUILD_COMMAND"
          elif bun -e 'const p = await Bun.file("package.json").json(); process.exit(p.scripts?.["build"] ? 0 : 1);'; then
            bun run build
          else
            echo "No build script; skipping"
          fi

      - name: Type check
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
        run: |
          if [[ -n "$CHECK_COMMAND" ]]; then
            bash -lc "$CHECK_COMMAND"
          elif bun -e 'const p = await Bun.file("package.json").json(); process.exit(p.scripts?.["check"] ? 0 : 1);'; then
            bun run check
          else
            echo "No check script; skipping"
          fi

      - name: Install Playwright browser
        if: ${{ inputs.playwright-browser != '' }}
        env:
          PLAYWRIGHT_BROWSER: ${{ inputs.playwright-browser }}
        run: |
          case "$PLAYWRIGHT_BROWSER" in
            chromium | firefox | webkit) ;;
            *)
              echo "playwright-browser must be chromium, firefox, or webkit" >&2
              exit 1
              ;;
          esac
          bunx playwright install "$PLAYWRIGHT_BROWSER"

      - name: Test
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          if [[ -n "$TEST_COMMAND" ]]; then
            bash -lc "$TEST_COMMAND"
          else
            bun test
          fi
