name: CI TypeScript (Bun)

on:
  workflow_call:

jobs:
  build-and-test:
    name: Lint / Build / Check / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Lint
        run: |
          if bun -e 'const p = await Bun.file("package.json").json(); process.exit(p.scripts?.lint ? 0 : 1);'; then
            bun run lint
          else
            echo "⏭️ No lint script — skipping"
          fi

      - name: Build
        run: |
          if bun -e 'const p = await Bun.file("package.json").json(); process.exit(p.scripts?.build ? 0 : 1);'; then
            bun run build
          else
            echo "⏭️ No build script — skipping"
          fi

      - name: Type check
        run: |
          if bun -e 'const p = await Bun.file("package.json").json(); process.exit(p.scripts?.check ? 0 : 1);'; then
            bun run check
          else
            echo "⏭️ No check script — skipping"
          fi

      - name: Test
        run: |
          if rg --files -g '*.test.ts' -g '*.test.tsx' -g '*.spec.ts' -g '*.spec.tsx' | rg -q '.'; then
            bun test
          else
            echo "⏭️ No test files found — skipping"
          fi
