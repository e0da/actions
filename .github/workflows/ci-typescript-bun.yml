name: CI TypeScript (Bun)

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for the TypeScript/Bun job."
        required: false
        type: string
        default: ubuntu-latest
      bun-version:
        description: "Bun version passed to oven-sh/setup-bun."
        required: false
        type: string
        default: latest
      env:
        description: "Optional newline-delimited KEY=VALUE entries exported before commands run."
        required: false
        type: string
        default: ""
jobs:
  build-and-test:
    name: Format / Check / Test
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export CI environment
        env:
          CI_ENV: ${{ inputs.env }}
        run: echo "$CI_ENV" >> "$GITHUB_ENV"

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun test
