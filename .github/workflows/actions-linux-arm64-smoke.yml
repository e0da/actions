name: Actions Linux ARM64 ARC Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Actions Linux ARM64 ARC
    runs-on: actions-linux-arm64
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Host identity
        run: |
          uname -a
          uname -m
          id

      - name: Docker daemon
        run: docker version

      - name: Linux ARM64 container
        run: docker run --rm --platform linux/arm64 alpine:3.20 uname -m
