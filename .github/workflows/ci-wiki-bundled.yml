name: Reusable Wiki CI

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for the bundled wiki CI job."
        required: false
        type: string
        default: ubuntu-latest
      runner-profile:
        description: "Optional runner profile metadata for validation; does not affect scheduling."
        required: false
        type: string
        default: ""
      runner-capabilities:
        description: "Optional requested runner capability metadata for validation."
        required: false
        type: string
        default: ""
      runner-manifest:
        description: "Optional puck-linux-runner-image-contract.v1 JSON used to validate requested runner capabilities."
        required: false
        type: string
        default: ""
      tool-mode:
        description: "Tool setup mode for markdown link checking."
        required: false
        type: string
        default: workflow-install
      link-args:
        description: "Arguments passed to lychee."
        required: false
        type: string
        default: >-
          --verbose
          --no-progress
          --exclude-loopback
          --exclude-private
          --exclude "^mailto:"
          --exclude "^https://github.com/e0da/"
          '**/*.md'
      ruby-version:
        description: "Ruby version passed to ruby/setup-ruby on non-macOS runners. macOS self-hosted runners use Homebrew Ruby."
        required: false
        type: string
        default: "3.2"
      build-command:
        description: "Command that builds the Jekyll site."
        required: false
        type: string
        default: "bundle exec jekyll build --strict_front_matter"
      test-command:
        description: "Optional command that runs repository-specific site checks after build."
        required: false
        type: string
        default: ""
      hosted-drift-mode:
        description: "Hosted runner drift policy mode."
        required: false
        type: string
        default: report
      hosted-drift-allowlist-path:
        description: "Caller-owned TSV file documenting approved hosted fallback."
        required: false
        type: string
        default: .github/samos-hosted-runner-allowlist.tsv
      approval-labels:
        description: "Comma- or newline-delimited exact approved[...] labels to report as merge approval signals."
        required: false
        type: string
        default: approved[agency]
      approval-report:
        description: "Emit the advisory approval report on pull requests."
        required: false
        type: boolean
        default: true
      result-contract-mode:
        description: "Result contract mode. Legacy and observe preserve existing Wiki step consequences; enforce makes the verification contract gate authoritative."
        required: false
        type: string
        default: legacy
      verification-target:
        description: "Policy target: merge or deploy-preflight."
        required: false
        type: string
        default: merge
      result-policy-path:
        description: "Path to the caller-owned verification policy."
        required: false
        type: string
        default: .github/wiki-verification-policy.json
      result-adapter-command:
        description: "Optional caller-owned command that writes verification observations."
        required: false
        type: string
        default: ""
    outputs:
      result-contract-version:
        description: "Minimal result contract version. Empty in legacy mode."
        value: ${{ jobs['wiki-ci'].outputs['result-contract-version'] }}
      result-target:
        description: "Verification target. Empty in legacy mode."
        value: ${{ jobs['wiki-ci'].outputs['result-target'] }}
      result-conclusion:
        description: "Policy-applied conclusion. Empty in legacy mode."
        value: ${{ jobs['wiki-ci'].outputs['result-conclusion'] }}
      legacy-conclusion:
        description: "Legacy Wiki CI conclusion. Empty in legacy mode."
        value: ${{ jobs['wiki-ci'].outputs['legacy-conclusion'] }}
      parity:
        description: "Whether the legacy and policy-applied conclusions agree. Empty in legacy mode."
        value: ${{ jobs['wiki-ci'].outputs['parity'] }}
      blocking-checks:
        description: "JSON array of blocking check IDs. Empty in legacy mode."
        value: ${{ jobs['wiki-ci'].outputs['blocking-checks'] }}
      unavailable-checks:
        description: "JSON array of check IDs with unavailable evidence. Empty in legacy mode."
        value: ${{ jobs['wiki-ci'].outputs['unavailable-checks'] }}
      advisory-checks:
        description: "JSON array of advisory check IDs. Empty in legacy mode."
        value: ${{ jobs['wiki-ci'].outputs['advisory-checks'] }}
      records-published:
        description: "Whether the collector published canonical records. Empty in legacy mode."
        value: ${{ jobs['wiki-ci'].outputs['records-published'] }}

jobs:
  wiki-ci:
    name: Wiki CI
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    outputs:
      result-contract-version: ${{ steps.verification_contract.outputs['result-contract-version'] }}
      result-target: ${{ steps.verification_contract.outputs['result-target'] }}
      result-conclusion: ${{ steps.verification_contract.outputs['result-conclusion'] }}
      legacy-conclusion: ${{ steps.verification_contract.outputs['legacy-conclusion'] }}
      parity: ${{ steps.verification_contract.outputs['parity'] }}
      blocking-checks: ${{ steps.verification_contract.outputs['blocking-checks'] }}
      unavailable-checks: ${{ steps.verification_contract.outputs['unavailable-checks'] }}
      advisory-checks: ${{ steps.verification_contract.outputs['advisory-checks'] }}
      records-published: ${{ steps.verification_contract.outputs['records-published'] }}
    env:
      JEKYLL_ENV: production
    steps:
      - name: Add runner-local tools to PATH
        id: runner_tools
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        run: |
          set -eu

          if [ -d "$HOME/.local/bin" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Validate runner contract
        id: runner_contract
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        env:
          RUNNER_PROFILE: ${{ inputs['runner-profile'] }}
          RUNNER_CAPABILITIES: ${{ inputs['runner-capabilities'] }}
          RUNNER_MANIFEST: ${{ inputs['runner-manifest'] }}
          TOOL_MODE: ${{ inputs['tool-mode'] }}
          OBSERVED_RUNNER_OS: ${{ runner.os }}
          OBSERVED_RUNNER_ARCH: ${{ runner.arch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu

          case "$TOOL_MODE" in
            workflow-install|runner-preinstalled) ;;
            *)
              echo "::error::Unknown tool-mode '${TOOL_MODE}'. Expected one of: workflow-install, runner-preinstalled."
              exit 1
              ;;
          esac

          case "$RUNNER_PROFILE" in
            ""|hosted-linux|e0da-puck-linux-arm64|puck-macos-arm64) ;;
            *)
              echo "::error::Unknown runner-profile '${RUNNER_PROFILE}'. Expected one of: hosted-linux, e0da-puck-linux-arm64, puck-macos-arm64."
              exit 1
              ;;
          esac

          require_runner() {
            expected_os="$1"
            expected_arch="${2:-}"

            if [ "$OBSERVED_RUNNER_OS" != "$expected_os" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.os '${expected_os}', got '${OBSERVED_RUNNER_OS}'."
              exit 1
            fi

            if [ -n "$expected_arch" ] && [ "$OBSERVED_RUNNER_ARCH" != "$expected_arch" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.arch '${expected_arch}', got '${OBSERVED_RUNNER_ARCH}'."
              exit 1
            fi
          }

          case "$RUNNER_PROFILE" in
            hosted-linux) require_runner Linux ;;
            e0da-puck-linux-arm64) require_runner Linux ARM64 ;;
            puck-macos-arm64) require_runner macOS ARM64 ;;
          esac

          validate_runner_manifest() {
            [ -n "$RUNNER_MANIFEST" ] || return 0

            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::runner-manifest was provided, but jq was not found."
              exit 1
            fi

            schema="$(printf '%s' "$RUNNER_MANIFEST" | jq -r '.schema_version // ""')"
            if [ "$schema" != "puck-linux-runner-image-contract.v1" ]; then
              echo "::error::runner-manifest schema_version must be puck-linux-runner-image-contract.v1, got '${schema:-<missing>}'."
              exit 1
            fi

            repo="${REPOSITORY#*/}"
            runner_entry="$(printf '%s' "$RUNNER_MANIFEST" | jq -c --arg repo "$repo" '.runners[]? | select(.runner_identity.repo == $repo)' | sed -n '1p')"
            if [ -z "$runner_entry" ]; then
              echo "::error::runner-manifest missing runners[].runner_identity.repo entry for '${repo}'."
              exit 1
            fi

            manifest_profile="$(printf '%s' "$runner_entry" | jq -r '.runner_identity.runner_profile // ""')"
            if [ -n "$RUNNER_PROFILE" ] && [ "$manifest_profile" != "$RUNNER_PROFILE" ]; then
              echo "::error::runner-manifest runner_identity.runner_profile expected '${RUNNER_PROFILE}', got '${manifest_profile:-<missing>}'."
              exit 1
            fi

            manifest_os="$(printf '%s' "$runner_entry" | jq -r '.intended_contract_state.runner_os // ""')"
            if [ -n "$manifest_os" ] && [ "$manifest_os" != "$OBSERVED_RUNNER_OS" ]; then
              echo "::error::runner-manifest intended_contract_state.runner_os expected '${OBSERVED_RUNNER_OS}', got '${manifest_os}'."
              exit 1
            fi

            manifest_arch="$(printf '%s' "$runner_entry" | jq -r '.intended_contract_state.runner_arch // ""')"
            if [ -n "$manifest_arch" ] && [ "$manifest_arch" != "$OBSERVED_RUNNER_ARCH" ]; then
              echo "::error::runner-manifest intended_contract_state.runner_arch expected '${OBSERVED_RUNNER_ARCH}', got '${manifest_arch}'."
              exit 1
            fi

            if [ "$manifest_profile" = "e0da-puck-linux-arm64" ]; then
              runner_local_bin_path="$(printf '%s' "$runner_entry" | jq -r '.path_policy.runner_local_bin.path // ""')"
              if [ "$runner_local_bin_path" != "/runner/.local/bin" ]; then
                echo "::error::runner-manifest path_policy.runner_local_bin.path expected '/runner/.local/bin', got '${runner_local_bin_path:-<missing>}'."
                exit 1
              fi

              runner_local_bin_state="$(printf '%s' "$runner_entry" | jq -r '.path_policy.runner_local_bin.state // ""')"
              if [ "$runner_local_bin_state" != "directory" ]; then
                echo "::error::runner-manifest path_policy.runner_local_bin.state expected 'directory', got '${runner_local_bin_state:-<missing>}'."
                exit 1
              fi

              if ! printf '%s' "$runner_entry" | jq -e '.path_policy.runner_local_bin.in_path == true' >/dev/null; then
                runner_local_bin_in_path="$(printf '%s' "$runner_entry" | jq -r '.path_policy.runner_local_bin.in_path // false')"
                echo "::error::runner-manifest path_policy.runner_local_bin.in_path expected boolean true, got '${runner_local_bin_in_path}'."
                exit 1
              fi
            fi

            manifest_capabilities="$RUNNER_CAPABILITIES"
            if [ "$TOOL_MODE" = runner-preinstalled ]; then
              manifest_capabilities="${manifest_capabilities}${manifest_capabilities:+ }lychee"
            fi

            for capability in $manifest_capabilities; do
              tool_status="$(printf '%s' "$runner_entry" | jq -r --arg name "$capability" '([.tools[]? | select(.name == $name)] | first | .observed.status) // "missing-tool-entry"')"
              if [ "$tool_status" != "present" ]; then
                echo "::error::runner-manifest tools.${capability}.observed.status expected 'present', got '${tool_status}'."
                exit 1
              fi

              tool_version="$(printf '%s' "$runner_entry" | jq -r --arg name "$capability" '([.tools[]? | select(.name == $name)] | first | .observed.version) // ""')"
              if [ -z "$tool_version" ]; then
                echo "::error::runner-manifest tools.${capability}.observed.version expected a non-empty version."
                exit 1
              fi
            done
          }

          for capability in $RUNNER_CAPABILITIES; do
            case "$capability" in
              gh|ruby|brew|make|lychee|bun|jq)
                if ! command -v "$capability" >/dev/null 2>&1; then
                  echo "::error::runner-capabilities requested '${capability}', but command '${capability}' was not found."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Unknown runner-capabilities token '${capability}'. Expected one of: gh, ruby, brew, make, lychee, bun, jq."
                exit 1
                ;;
            esac
          done

          if [ "$TOOL_MODE" = runner-preinstalled ] && ! command -v lychee >/dev/null 2>&1; then
            echo "::error::tool-mode runner-preinstalled requires lychee on PATH."
            exit 1
          fi

          validate_runner_manifest

          echo "Runner contract OK: profile='${RUNNER_PROFILE:-<none>}' capabilities='${RUNNER_CAPABILITIES:-<none>}' tool-mode='${TOOL_MODE}' os='${OBSERVED_RUNNER_OS}' arch='${OBSERVED_RUNNER_ARCH}'."

      - uses: actions/checkout@v5
        id: checkout
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        with:
          fetch-depth: 0

      - name: Ensure GitHub CLI
        id: github_cli
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        shell: sh
        env:
          GH_CLI_VERSION: "2.93.0"
        run: |
          set -eu

          if command -v gh >/dev/null 2>&1; then
            echo "GitHub CLI already available: $(gh --version | head -n 1)"
            exit 0
          fi

          os="$(uname -s)"
          arch="$(uname -m)"
          temp_root="${RUNNER_TEMP:-/tmp}"
          tools_dir="${temp_root}/wiki-ci-bin"
          mkdir -p "$tools_dir"

          install_linux_tarball() {
            asset_arch="$1"
            archive="gh_${GH_CLI_VERSION}_linux_${asset_arch}.tar.gz"
            extract_dir="${temp_root}/gh_${GH_CLI_VERSION}_linux_${asset_arch}"

            curl -fsSL \
              "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${archive}" \
              -o "${temp_root}/${archive}"
            tar -xzf "${temp_root}/${archive}" -C "$temp_root"
            cp "${extract_dir}/bin/gh" "${tools_dir}/gh"
            chmod 0755 "${tools_dir}/gh"
          }

          case "${os}:${arch}" in
            Linux:aarch64|Linux:arm64)
              install_linux_tarball arm64
              ;;
            Linux:x86_64|Linux:amd64)
              install_linux_tarball amd64
              ;;
            Darwin:*)
              if command -v brew >/dev/null 2>&1; then
                brew install gh
                exit 0
              fi
              echo "::error::GitHub CLI is missing and automatic install is only supported for Linux tarballs or macOS runners with Homebrew."
              exit 1
              ;;
            *)
              echo "::error::GitHub CLI is missing and automatic install does not support ${os}/${arch}."
              exit 1
              ;;
          esac

          if [ -z "${GITHUB_PATH:-}" ]; then
            echo "::error::GITHUB_PATH is unavailable; cannot expose installed gh to later steps."
            exit 1
          fi

          echo "$tools_dir" >> "$GITHUB_PATH"
          "${tools_dir}/gh" --version | head -n 1

      - name: Approval report
        id: approval_report
        if: ${{ inputs['approval-report'] && github.event_name == 'pull_request' }}
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          ALLOWED_LABELS: ${{ inputs['approval-labels'] }}
        run: |
          set -eu

          temp_root="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$temp_root"
          workdir="$(mktemp -d "${temp_root}/wiki-approval-report.XXXXXX")"
          trap 'rm -rf "$workdir"' EXIT INT TERM

          allowed_file="$workdir/allowed-labels.txt"
          live_labels_file="$workdir/live-labels.txt"
          matched_labels_file="$workdir/matched-labels.txt"
          ignored_approval_labels_file="$workdir/ignored-approval-labels.txt"
          latest_reviews_file="$workdir/latest-reviews.tsv"
          approved_reviewers_file="$workdir/approved-reviewers.txt"
          : > "$allowed_file"
          : > "$live_labels_file"
          : > "$matched_labels_file"
          : > "$ignored_approval_labels_file"
          : > "$latest_reviews_file"
          : > "$approved_reviewers_file"

          is_approval_label() {
            printf '%s\n' "$1" | grep -Eq '^approved\[[A-Za-z0-9._-]+\]$'
          }

          join_file() {
            awk '
              BEGIN { first = 1 }
              {
                if (!first) {
                  printf ", "
                }
                printf "%s", $0
                first = 0
              }
              END {
                if (first) {
                  printf "none"
                }
                printf "\n"
              }
            ' "$1"
          }

          printf '%s\n' "$ALLOWED_LABELS" |
            tr ',' '\n' |
            sed 's/^[[:space:]]*//' |
            sed 's/[[:space:]]*$//' |
            sed '/^$/d' |
            sort -u > "$allowed_file"

          if [ ! -s "$allowed_file" ]; then
            echo "::error::approval-labels must contain at least one label."
            exit 1
          fi

          while IFS= read -r allowed_label; do
            if ! is_approval_label "$allowed_label"; then
              echo "::error::allowed approval label '${allowed_label}' must match approved[<approver-id>]."
              exit 1
            fi
          done < "$allowed_file"

          if [ -z "${PULL_REQUEST_NUMBER:-}" ]; then
            echo "signal=skipped" >> "$GITHUB_OUTPUT"
            echo "Approval report skipped outside pull request context."
            exit 0
          fi

          gh api "repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/labels" \
            --paginate \
            --jq '.[].name' > "$live_labels_file"

          while IFS= read -r live_label; do
            if grep -Fx "$live_label" "$allowed_file" >/dev/null; then
              printf '%s\n' "$live_label" >> "$matched_labels_file"
            elif is_approval_label "$live_label"; then
              printf '%s\n' "$live_label" >> "$ignored_approval_labels_file"
            fi
          done < "$live_labels_file"

          gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews" \
            --paginate \
            --jq '.[] | [.user.login, .state] | @tsv' |
            awk -F "$(printf '\t')" '
              NF >= 2 { latest[$1] = $2 }
              END {
                for (reviewer in latest) {
                  print reviewer "\t" latest[reviewer]
                }
              }
            ' > "$latest_reviews_file"

          awk -F "$(printf '\t')" '$2 == "APPROVED" { print $1 }' "$latest_reviews_file" |
            sort -u > "$approved_reviewers_file"

          if [ -s "$matched_labels_file" ] || [ -s "$approved_reviewers_file" ]; then
            echo "signal=present" >> "$GITHUB_OUTPUT"
            echo "Approval report found approval signal."
            echo "Approved reviewers: $(join_file "$approved_reviewers_file")"
            echo "Approved labels: $(join_file "$matched_labels_file")"
            exit 0
          fi

          echo "signal=missing" >> "$GITHUB_OUTPUT"
          echo "::notice::approval report found no merge approval signal; CI remains healthy."
          echo "Agency merge authority must block merge until a review record or approved[...] label exists."
          if [ -s "$ignored_approval_labels_file" ]; then
            echo "Ignored approval labels: $(join_file "$ignored_approval_labels_file")"
          fi
          exit 0

      - name: Check PR title
        id: pr_title
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          title="$EVENT_PR_TITLE"
          if [[ -n "$PR_NUMBER" ]]; then
            current_title="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title' 2>/dev/null || true)"
            if [[ -n "$current_title" ]]; then
              title="$current_title"
            fi
          fi

          if [[ ! "$title" =~ ^(feat|fix|chore|docs|refactor|test|ci)(\(.+\))?:[[:space:]].+ ]]; then
            echo "::error::PR title must follow Conventional Commits format. Got: $title"
            exit 1
          fi

          echo "PR title OK: $title"

      - name: Scan workflow runner routing
        id: hosted_drift
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        env:
          MODE: ${{ inputs['hosted-drift-mode'] }}
          ALLOWLIST_PATH: ${{ inputs['hosted-drift-allowlist-path'] }}
        run: |
          set -eu

          case "$MODE" in
            report|enforce) ;;
            *)
              echo "::error::Unknown hosted-drift-mode '${MODE}'. Expected report or enforce."
              exit 1
              ;;
          esac

          temp_root="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$temp_root"
          workdir="$(mktemp -d "${temp_root}/wiki-hosted-drift.XXXXXX")"
          hosted="$workdir/hosted.tsv"
          approved="$workdir/approved.tsv"
          unapproved="$workdir/unapproved.tsv"
          puck="$workdir/puck.tsv"
          unknown="$workdir/unknown.tsv"
          invalid_allowlist="$workdir/invalid-allowlist.tsv"
          : > "$hosted"
          : > "$approved"
          : > "$unapproved"
          : > "$puck"
          : > "$unknown"
          : > "$invalid_allowlist"

          classify_line() {
            file="$1"
            line="$2"
            job="$3"
            runner="$4"
            text="$5"
            target="$unknown"

            case "$runner" in
              ubuntu-latest|macos-latest|windows-latest) target="$hosted" ;;
              *puck*|*self-hosted*) target="$puck" ;;
              expression|unknown) target="$unknown" ;;
            esac

            printf '%s\t%s\t%s\t%s\t%s\n' "$file" "$line" "$job" "$runner" "$text" >> "$target"
          }

          scan_file() {
            file="$1"
            awk '
              function trim(value) {
                sub(/^[[:space:]]+/, "", value)
                sub(/[[:space:]]+$/, "", value)
                return value
              }
              /^jobs:[[:space:]]*$/ { in_jobs=1; job=""; next }
              in_jobs && /^[^[:space:]][^:]*:/ { in_jobs=0; job="" }
              in_jobs && /^  [A-Za-z0-9_-]+:[[:space:]]*$/ {
                job=trim($0)
                sub(/:$/, "", job)
              }
              /^[[:space:]]*runs-on:[[:space:]]*/ {
                text=$0
                runner="unknown"
                if (text ~ /ubuntu-latest/) runner="ubuntu-latest"
                else if (text ~ /macos-latest/) runner="macos-latest"
                else if (text ~ /windows-latest/) runner="windows-latest"
                else if (text ~ /(self-hosted|puck)/) runner="self-hosted"
                else if (text ~ /\$\{\{/) runner="expression"
                print FNR "\t" job "\t" runner "\t" text
              }
              /uses:[[:space:]]*e0da\/actions\/\.github\/workflows\/[^[:space:]]+\.yml@/ {
                print FNR "\t" job "\treusable\t" $0
              }
            ' "$file" |
              while IFS="$(printf '\t')" read -r line job runner text; do
                if [ "$runner" = reusable ]; then
                  window="$(tail -n +"$line" "$file" | sed -n '1,30p')"
                  runner_input="$(printf '%s\n' "$window" | sed -n 's/^[[:space:]]*[a-zA-Z0-9_-]*runner:[[:space:]]*//p' | sed -n '1p')"
                  if [ -z "$runner_input" ]; then
                    runner_input="ubuntu-latest"
                  elif printf '%s\n' "$runner_input" | grep -Eq '^\$\{\{'; then
                    runner_input="expression"
                  fi
                  classify_line "$file" "$line" "$job" "$runner_input" "$text"
                else
                  classify_line "$file" "$line" "$job" "$runner" "$text"
                fi
              done
          }

          if [ -f "$ALLOWLIST_PATH" ]; then
            awk -v today="$(date -u +%F)" '
              /^[[:space:]]*($|#)/ { next }
              {
                fields=split($0, parts, "\t")
                if (fields < 6 || parts[4] !~ /^E0D-[0-9]+$/ || parts[5] !~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/ || parts[5] < today) {
                  print $0
                }
              }
            ' "$ALLOWLIST_PATH" > "$invalid_allowlist"
          fi

          if [ -d .github/workflows ]; then
            find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort |
              while IFS= read -r file; do
                scan_file "$file"
              done
          fi

          if [ -s "$ALLOWLIST_PATH" ]; then
            while IFS="$(printf '\t')" read -r file line job runner text; do
              if awk -F "$(printf '\t')" -v f="$file" -v j="$job" -v r="$runner" '
                $1 == f && ($2 == "*" || $2 == j) && $3 == r { found=1 }
                END { exit(found ? 0 : 1) }
              ' "$ALLOWLIST_PATH"; then
                printf '%s\t%s\t%s\t%s\t%s\n' "$file" "$line" "$job" "$runner" "$text" >> "$approved"
              else
                printf '%s\t%s\t%s\t%s\t%s\n' "$file" "$line" "$job" "$runner" "$text" >> "$unapproved"
              fi
            done < "$hosted"
          else
            cp "$hosted" "$unapproved"
          fi

          {
            echo "## Hosted Runner Drift"
            echo
            echo "| Finding | Count |"
            echo "| --- | ---: |"
            echo "| Approved hosted findings | $(wc -l < "$approved" | tr -d ' ') |"
            echo "| Unapproved hosted findings | $(wc -l < "$unapproved" | tr -d ' ') |"
            echo "| Puck/self-hosted findings | $(wc -l < "$puck" | tr -d ' ') |"
            echo "| Unknown findings | $(wc -l < "$unknown" | tr -d ' ') |"
            echo "| Invalid allowlist entries | $(wc -l < "$invalid_allowlist" | tr -d ' ') |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MODE" = enforce ] && [ -s "$invalid_allowlist" ]; then
            echo "::error::mode=enforce failed because invalid allowlist entries were found."
            exit 1
          fi

          if [ "$MODE" = enforce ] && [ -s "$unapproved" ]; then
            echo "::error::mode=enforce failed because unapproved hosted runner findings were found."
            exit 1
          fi

          if [ -s "$unknown" ]; then
            echo "::notice::Unknown runner findings were reported. They are visible but non-blocking."
          fi

      - name: Install Gitleaks CLI
        id: gitleaks_install
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail

          case "${RUNNER_OS}_${RUNNER_ARCH}" in
            Linux_X64)
              asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
              sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
              ;;
            Linux_ARM64)
              asset="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
              sha256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
              ;;
            macOS_X64)
              asset="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz"
              sha256="dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709"
              ;;
            macOS_ARM64)
              asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
              sha256="b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
              ;;
            *)
              echo "unsupported runner for Gitleaks CLI install: ${RUNNER_OS}_${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac

          archive_path="${RUNNER_TEMP}/${asset}"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --silent --show-error --location \
            --output "$archive_path" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${sha256}  ${archive_path}" | shasum -a 256 --check
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir" gitleaks
          chmod +x "${install_dir}/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Secret scan
        id: secret_scan
        continue-on-error: true
        run: gitleaks detect --source . --verbose --redact

      - name: Check links
        id: link_check_linux_install
        if: runner.os == 'Linux' && inputs['tool-mode'] == 'workflow-install'
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ inputs['link-args'] }}
          failIfEmpty: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check links with preinstalled lychee
        id: link_check_linux_preinstalled
        if: runner.os == 'Linux' && inputs['tool-mode'] == 'runner-preinstalled'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LYCHEE_ARGS: ${{ inputs['link-args'] }}
        run: bash -lc "lychee ${LYCHEE_ARGS}"

      - name: Install lychee
        id: lychee_install_macos
        if: runner.os == 'macOS' && inputs['tool-mode'] == 'workflow-install'
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        run: |
          if command -v lychee >/dev/null 2>&1; then
            exit 0
          fi

          if ! command -v brew >/dev/null 2>&1; then
            echo "Homebrew is required to install lychee on macOS self-hosted runners."
            exit 1
          fi

          brew install lychee

      - name: Check links
        id: link_check_macos
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LYCHEE_ARGS: ${{ inputs['link-args'] }}
        run: bash -lc "lychee ${LYCHEE_ARGS}"

      - name: Set up Ruby
        id: ruby_setup_linux
        if: runner.os != 'macOS'
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs['ruby-version'] }}
          bundler-cache: true

      - name: Set up Ruby
        id: ruby_setup_macos
        if: runner.os == 'macOS'
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        env:
          RUBY_VERSION: ${{ inputs['ruby-version'] }}
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            echo "Homebrew is required to install Ruby on macOS self-hosted runners."
            exit 1
          fi

          ruby_series="$(printf '%s\n' "$RUBY_VERSION" | awk -F. '{ print $1 "." $2 }')"
          ruby_formula="ruby@${ruby_series}"

          if ! brew info "$ruby_formula" >/dev/null 2>&1; then
            echo "Homebrew formula ${ruby_formula} is unavailable."
            exit 1
          fi

          if ! brew list "$ruby_formula" >/dev/null 2>&1; then
            brew install "$ruby_formula"
          fi

          ruby_prefix="$(brew --prefix "$ruby_formula")"
          echo "${ruby_prefix}/bin" >> "$GITHUB_PATH"
          export PATH="${ruby_prefix}/bin:$PATH"

          ruby --version
          gem install bundler --no-document
          bundle config set --local path "$RUNNER_TEMP/bundle"
          bundle install --jobs 4 --retry 3

      - name: Validate YAML frontmatter in .md files
        id: frontmatter
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        run: |
          ruby <<'RB'
          require "date"
          require "yaml"

          files = `git ls-files "*.md"`.split("\n")
          failed = false

          files.each do |path|
            content = File.read(path, encoding: "UTF-8")
            next unless content.start_with?("---\n")

            match = content.match(/\A---\R(.*?)\R---\R/m)
            unless match && !match[1].strip.empty?
              warn "ERROR #{path}: Unclosed or empty frontmatter block"
              failed = true
              next
            end

            begin
              YAML.safe_load(match[1], permitted_classes: [Date, Time], aliases: true)
            rescue Psych::Exception => error
              warn "ERROR #{path}: Invalid YAML frontmatter: #{error.message}"
              failed = true
            else
              puts "OK #{path}"
            end
          end

          exit(failed ? 1 : 0)
          RB

      - name: Install ripgrep
        id: ripgrep_install
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo_cmd=""
            if command -v sudo >/dev/null 2>&1; then
              sudo_cmd="sudo"
            fi

            case "$(uname -s)" in
              Darwin)
                if ! command -v brew >/dev/null 2>&1; then
                  echo "Homebrew is required to install ripgrep on macOS self-hosted runners."
                  exit 1
                fi
                brew install ripgrep
                ;;
              Linux)
                if command -v apt-get >/dev/null 2>&1; then
                  $sudo_cmd apt-get update
                  $sudo_cmd apt-get install -y ripgrep
                elif command -v apk >/dev/null 2>&1; then
                  $sudo_cmd apk add --no-cache ripgrep
                else
                  echo "No supported package manager found for ripgrep."
                  exit 1
                fi
                ;;
              *)
                echo "No supported ripgrep install path for $(uname -s)."
                exit 1
                ;;
            esac
          fi

      - name: Build
        id: build
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        env:
          BUILD_COMMAND: ${{ inputs['build-command'] }}
        run: bash -c "$BUILD_COMMAND"

      - name: Test
        id: wiki_test
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        env:
          TEST_COMMAND: ${{ inputs['test-command'] }}
        run: |
          if [ -z "$TEST_COMMAND" ]; then
            echo "No test command configured."
            exit 0
          fi

          bash -c "$TEST_COMMAND"

      - name: Write check summary
        id: check_summary
        if: always()
        continue-on-error: ${{ inputs['result-contract-mode'] == 'enforce' }}
        env:
          APPROVAL_OUTCOME: ${{ steps.approval_report.outcome }}
          APPROVAL_SIGNAL: ${{ steps.approval_report.outputs.signal }}
          PR_TITLE_OUTCOME: ${{ steps.pr_title.outcome }}
          HOSTED_DRIFT_OUTCOME: ${{ steps.hosted_drift.outcome }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          SECRET_SCAN_CONCLUSION: ${{ steps.secret_scan.conclusion }}
          LINK_LINUX_INSTALL_OUTCOME: ${{ steps.link_check_linux_install.outcome }}
          LINK_LINUX_PREINSTALLED_OUTCOME: ${{ steps.link_check_linux_preinstalled.outcome }}
          LINK_MACOS_OUTCOME: ${{ steps.link_check_macos.outcome }}
          FRONTMATTER_OUTCOME: ${{ steps.frontmatter.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.wiki_test.outcome }}
        run: |
          set -eu

          normalize_status() {
            outcome="$1"
            if [ -z "$outcome" ] || [ "$outcome" = skipped ]; then
              printf 'skipped\n'
            elif [ "$outcome" = success ]; then
              printf 'pass\n'
            else
              printf 'fail\n'
            fi
          }

          approval_status() {
            case "${APPROVAL_SIGNAL:-}" in
              present) printf 'pass\n' ;;
              missing) printf 'advisory\n' ;;
              skipped|"") normalize_status "${APPROVAL_OUTCOME:-}" ;;
              *) normalize_status "${APPROVAL_OUTCOME:-}" ;;
            esac
          }

          secret_scan_status() {
            if [ "${SECRET_SCAN_OUTCOME:-}" = failure ] && [ "${SECRET_SCAN_CONCLUSION:-}" = success ]; then
              printf 'advisory\n'
              return
            fi

            normalize_status "${SECRET_SCAN_OUTCOME:-}"
          }

          remote_link_status() {
            for outcome in "${LINK_LINUX_INSTALL_OUTCOME:-}" "${LINK_LINUX_PREINSTALLED_OUTCOME:-}" "${LINK_MACOS_OUTCOME:-}"; do
              case "$outcome" in
                failure|cancelled)
                  printf 'fail (blocking)\n'
                  return
                  ;;
                success)
                  printf 'pass\n'
                  return
                  ;;
              esac
            done

            printf 'skipped\n'
          }

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Wiki CI Summary"
              echo
              echo "| Check | Status |"
              echo "| --- | --- |"
              echo "| Approval | $(approval_status) |"
              echo "| Hosted drift | $(normalize_status "${HOSTED_DRIFT_OUTCOME:-}") |"
              echo "| PR title | $(normalize_status "${PR_TITLE_OUTCOME:-}") |"
              echo "| Secret scan | $(secret_scan_status) |"
              echo "| Broken links | $(remote_link_status) |"
              echo "| Frontmatter | $(normalize_status "${FRONTMATTER_OUTCOME:-}") |"
              echo "| Jekyll build | $(normalize_status "${BUILD_OUTCOME:-}") |"
              echo "| Repository tests | $(normalize_status "${TEST_OUTCOME:-}") |"

              if [ "$(remote_link_status)" = "fail (blocking)" ]; then
                echo
                echo "> Owner/action: the wiki link steward rechecks the remote result; the Actions maintainer owns verifier or runner failure."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run result adapter
        id: result_adapter
        if: always() && inputs['result-contract-mode'] != 'legacy' && inputs['result-adapter-command'] != ''
        continue-on-error: true
        shell: sh
        env:
          RESULT_ADAPTER_COMMAND: ${{ inputs['result-adapter-command'] }}
          RESULT_RECORDS_DIR: .wiki-verification/observations
          TESTED_COMMIT: ${{ github.sha }}
          TESTED_TREE: ""
          LEGACY_JOB_STATUS: ${{ job.status }}
          LEGACY_CONCLUSION: ${{ (steps.link_check_linux_install.outcome == 'failure' || steps.link_check_linux_install.outcome == 'cancelled' || steps.link_check_linux_preinstalled.outcome == 'failure' || steps.link_check_linux_preinstalled.outcome == 'cancelled' || steps.link_check_macos.outcome == 'failure' || steps.link_check_macos.outcome == 'cancelled') && 'fail' || 'pass' }}
          LEGACY_RUNNER_TOOLS_OUTCOME: ${{ steps.runner_tools.outcome }}
          LEGACY_RUNNER_CONTRACT_OUTCOME: ${{ steps.runner_contract.outcome }}
          LEGACY_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          LEGACY_GITHUB_CLI_OUTCOME: ${{ steps.github_cli.outcome }}
          LEGACY_APPROVAL_REPORT_OUTCOME: ${{ steps.approval_report.outcome }}
          LEGACY_PR_TITLE_OUTCOME: ${{ steps.pr_title.outcome }}
          LEGACY_HOSTED_DRIFT_OUTCOME: ${{ steps.hosted_drift.outcome }}
          LEGACY_GITLEAKS_INSTALL_OUTCOME: ${{ steps.gitleaks_install.outcome }}
          LEGACY_SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          LEGACY_LINK_CHECK_LINUX_INSTALL_OUTCOME: ${{ steps.link_check_linux_install.outcome }}
          LEGACY_LINK_CHECK_LINUX_PREINSTALLED_OUTCOME: ${{ steps.link_check_linux_preinstalled.outcome }}
          LEGACY_LYCHEE_INSTALL_MACOS_OUTCOME: ${{ steps.lychee_install_macos.outcome }}
          LEGACY_LINK_CHECK_MACOS_OUTCOME: ${{ steps.link_check_macos.outcome }}
          LEGACY_RUBY_SETUP_LINUX_OUTCOME: ${{ steps.ruby_setup_linux.outcome }}
          LEGACY_RUBY_SETUP_MACOS_OUTCOME: ${{ steps.ruby_setup_macos.outcome }}
          LEGACY_FRONTMATTER_OUTCOME: ${{ steps.frontmatter.outcome }}
          LEGACY_RIPGREP_INSTALL_OUTCOME: ${{ steps.ripgrep_install.outcome }}
          LEGACY_BUILD_OUTCOME: ${{ steps.build.outcome }}
          LEGACY_WIKI_TEST_OUTCOME: ${{ steps.wiki_test.outcome }}
          LEGACY_CHECK_SUMMARY_OUTCOME: ${{ steps.check_summary.outcome }}
        run: |
          set -eu

          if [ -z "$TESTED_TREE" ]; then
            TESTED_TREE="$(git rev-parse "${TESTED_COMMIT}^{tree}")"
          fi
          export TESTED_TREE

          sh -c "$RESULT_ADAPTER_COMMAND"

      - name: Collect verification contract
        id: verification_contract
        if: always() && inputs['result-contract-mode'] != 'legacy'
        continue-on-error: true
        shell: sh
        env:
          RESULT_CONTRACT_MODE: ${{ inputs['result-contract-mode'] }}
          VERIFICATION_TARGET: ${{ inputs['verification-target'] }}
          RESULT_POLICY_PATH: ${{ inputs['result-policy-path'] }}
          RESULT_ADAPTER_COMMAND: ${{ inputs['result-adapter-command'] }}
          RESULT_ADAPTER_OUTCOME: ${{ steps.result_adapter.outcome }}
          RESULT_RECORDS_DIR: .wiki-verification/observations
          RESULT_OUTPUT_PATH: ${{ runner.temp }}/wiki-verification-minimal.jsonl
          TESTED_COMMIT: ${{ github.sha }}
          TESTED_TREE: ""
          LEGACY_CONCLUSION: ${{ (steps.link_check_linux_install.outcome == 'failure' || steps.link_check_linux_install.outcome == 'cancelled' || steps.link_check_linux_preinstalled.outcome == 'failure' || steps.link_check_linux_preinstalled.outcome == 'cancelled' || steps.link_check_macos.outcome == 'failure' || steps.link_check_macos.outcome == 'cancelled') && 'fail' || 'pass' }}
          LEGACY_JOB_STATUS: ${{ job.status }}
          LEGACY_RUNNER_TOOLS_OUTCOME: ${{ steps.runner_tools.outcome }}
          LEGACY_RUNNER_CONTRACT_OUTCOME: ${{ steps.runner_contract.outcome }}
          LEGACY_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          LEGACY_GITHUB_CLI_OUTCOME: ${{ steps.github_cli.outcome }}
          LEGACY_APPROVAL_REPORT_OUTCOME: ${{ steps.approval_report.outcome }}
          LEGACY_PR_TITLE_OUTCOME: ${{ steps.pr_title.outcome }}
          LEGACY_HOSTED_DRIFT_OUTCOME: ${{ steps.hosted_drift.outcome }}
          LEGACY_GITLEAKS_INSTALL_OUTCOME: ${{ steps.gitleaks_install.outcome }}
          LEGACY_LYCHEE_INSTALL_MACOS_OUTCOME: ${{ steps.lychee_install_macos.outcome }}
          LEGACY_RUBY_SETUP_LINUX_OUTCOME: ${{ steps.ruby_setup_linux.outcome }}
          LEGACY_RUBY_SETUP_MACOS_OUTCOME: ${{ steps.ruby_setup_macos.outcome }}
          LEGACY_FRONTMATTER_OUTCOME: ${{ steps.frontmatter.outcome }}
          LEGACY_RIPGREP_INSTALL_OUTCOME: ${{ steps.ripgrep_install.outcome }}
          LEGACY_BUILD_OUTCOME: ${{ steps.build.outcome }}
          LEGACY_WIKI_TEST_OUTCOME: ${{ steps.wiki_test.outcome }}
          LEGACY_CHECK_SUMMARY_OUTCOME: ${{ steps.check_summary.outcome }}
        run: |
          set -eu

          case "${LEGACY_JOB_STATUS:-}" in
            failure|cancelled) LEGACY_CONCLUSION=fail ;;
          esac

          for legacy_outcome in \
            "${LEGACY_RUNNER_TOOLS_OUTCOME:-}" \
            "${LEGACY_RUNNER_CONTRACT_OUTCOME:-}" \
            "${LEGACY_CHECKOUT_OUTCOME:-}" \
            "${LEGACY_GITHUB_CLI_OUTCOME:-}" \
            "${LEGACY_APPROVAL_REPORT_OUTCOME:-}" \
            "${LEGACY_PR_TITLE_OUTCOME:-}" \
            "${LEGACY_HOSTED_DRIFT_OUTCOME:-}" \
            "${LEGACY_GITLEAKS_INSTALL_OUTCOME:-}" \
            "${LEGACY_LYCHEE_INSTALL_MACOS_OUTCOME:-}" \
            "${LEGACY_RUBY_SETUP_LINUX_OUTCOME:-}" \
            "${LEGACY_RUBY_SETUP_MACOS_OUTCOME:-}" \
            "${LEGACY_FRONTMATTER_OUTCOME:-}" \
            "${LEGACY_RIPGREP_INSTALL_OUTCOME:-}" \
            "${LEGACY_BUILD_OUTCOME:-}" \
            "${LEGACY_WIKI_TEST_OUTCOME:-}" \
            "${LEGACY_CHECK_SUMMARY_OUTCOME:-}"
          do
            case "$legacy_outcome" in
              failure|cancelled) LEGACY_CONCLUSION=fail ;;
            esac
          done

          write_consequence_summary() {
            if [ "$RESULT_CONTRACT_MODE" = enforce ]; then
              echo "The verification contract gate controls the final consequence; legacy Wiki step outcomes are collected."
            else
              echo "Existing Wiki steps keep their current consequences."
            fi
          }

          write_preflight_report() {
            reason="$1"

            case "$LEGACY_CONCLUSION" in
              fail|failure) parity=match ;;
              *) parity=difference ;;
            esac

            echo "::notice::$reason" >&2
            {
              echo "result-contract-version=wiki-verification-minimal.v1"
              echo "result-target=$VERIFICATION_TARGET"
              echo "result-conclusion=evidence_unavailable"
              echo "legacy-conclusion=$LEGACY_CONCLUSION"
              echo "parity=$parity"
              echo "blocking-checks=[]"
              echo "unavailable-checks=[\"actions.contract\"]"
              echo "advisory-checks=[]"
              echo "records-published=false"
            } >> "$GITHUB_OUTPUT"

            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## Verification Contract v1"
                echo
                echo "Target: $VERIFICATION_TARGET"
                echo
                echo "Conclusion: evidence_unavailable"
                echo
                echo "Legacy parity: $parity ($LEGACY_CONCLUSION)"
                echo
                echo "Canonical records: unavailable"
                echo
                echo "Unavailable checks: \`actions.contract\`"
                echo
                echo "Preflight: $reason"
                echo
                write_consequence_summary
                echo
                echo "## Verification Details"
                echo
                echo "| Check ID | Observed state | Availability | Attribution | Reader impact | Applied effect | Owner | Action | Evidence |"
                echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
                echo "| actions.contract | not_evaluated | unavailable | actions diagnostic | collector prerequisites unavailable | block | actions-maintainers | restore collector prerequisites and rerun | actions:preflight |"
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            exit 0
          }

          command -v jq >/dev/null 2>&1 || write_preflight_report "jq is unavailable; the collector could not validate or publish canonical records."

          if [ -n "${RESULT_ADAPTER_COMMAND:-}" ] && [ "${RESULT_ADAPTER_OUTCOME:-}" != success ]; then
            write_preflight_report "The result adapter failed; canonical records were not published."
          fi

          case "$RESULT_CONTRACT_MODE" in
            observe|enforce) ;;
            *) write_preflight_report "result-contract-mode must be legacy, observe, or enforce." ;;
          esac

          case "$VERIFICATION_TARGET" in
            merge|deploy-preflight) ;;
            *) write_preflight_report "verification-target must be merge or deploy-preflight." ;;
          esac

          is_git_oid() {
            [ "${#1}" -eq 40 ] || return 1
            case "$1" in
              *[!0-9a-f]*) return 1 ;;
              *) return 0 ;;
            esac
          }

          is_git_oid "$TESTED_COMMIT" || write_preflight_report "TESTED_COMMIT must be a 40-character lowercase Git object ID."

          if [ -z "$TESTED_TREE" ]; then
            if ! TESTED_TREE="$(git rev-parse "${TESTED_COMMIT}^{tree}" 2>/dev/null)"; then
              write_preflight_report "The collector could not resolve the tested tree."
            fi
          fi

          is_git_oid "$TESTED_TREE" || write_preflight_report "TESTED_TREE must be a 40-character lowercase Git object ID."

          mkdir -p "$(dirname "$RESULT_OUTPUT_PATH")"
          work_dir="$(mktemp -d)"
          candidate="${RESULT_OUTPUT_PATH}.tmp.$$"
          cleanup() {
            rm -rf "$work_dir"
            [ -z "${candidate:-}" ] || rm -f "$candidate"
          }
          trap cleanup EXIT INT TERM

          write_result() {
            result_conclusion="$1"
            blocking_checks="$2"
            unavailable_checks="$3"
            advisory_checks="$4"

            case "$LEGACY_CONCLUSION:$result_conclusion" in
              pass:trusted|pass:trusted_with_advisories|success:trusted|success:trusted_with_advisories|fail:blocked|failure:blocked|fail:evidence_unavailable|failure:evidence_unavailable)
                parity=match
                ;;
              *)
                parity=difference
                ;;
            esac

            {
              echo "result-contract-version=wiki-verification-minimal.v1"
              echo "result-target=$VERIFICATION_TARGET"
              echo "result-conclusion=$result_conclusion"
              echo "legacy-conclusion=$LEGACY_CONCLUSION"
              echo "parity=$parity"
              echo "blocking-checks=$blocking_checks"
              echo "unavailable-checks=$unavailable_checks"
              echo "advisory-checks=$advisory_checks"
              echo "records-published=true"
            } >> "$GITHUB_OUTPUT"

            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## Verification Contract v1"
                echo
                echo "Target: $VERIFICATION_TARGET"
                echo
                echo "Conclusion: $result_conclusion"
                echo
                echo "Legacy parity: $parity ($LEGACY_CONCLUSION)"
                echo
                echo "| Set | Check IDs |"
                echo "| --- | --- |"
                echo "| Blocking | \`$blocking_checks\` |"
                echo "| Unavailable | \`$unavailable_checks\` |"
                echo "| Advisory | \`$advisory_checks\` |"
                echo
                write_consequence_summary
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          append_detail_table() {
            details_file="$1"

            [ -n "${GITHUB_STEP_SUMMARY:-}" ] || return 0
            {
              echo
              echo "## Verification Details"
              echo
              echo "| Check ID | Observed state | Availability | Attribution | Reader impact | Applied effect | Owner | Action | Evidence |"
              echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
              jq -r '
                def markdown_cell:
                  (if . == null then "" else tostring end) |
                  gsub("&"; "&amp;") |
                  gsub("<"; "&lt;") |
                  gsub(">"; "&gt;") |
                  gsub("\\|"; "&#124;") |
                  gsub("`"; "&#96;") |
                  gsub("[\\r\\n]+"; " ");
                .[] |
                [
                  .check_id,
                  .observed_state,
                  .availability,
                  .attribution,
                  .reader_impact,
                  .applied_effect,
                  .owner,
                  .action,
                  .evidence_ref
                ] |
                map(markdown_cell) |
                "| " + join(" | ") + " |"
              ' "$details_file"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          append_actions_details() {
            details_file="$work_dir/actions-details.json"
            jq -s '[
              .[] | {
                check_id,
                observed_state,
                availability,
                attribution: "actions diagnostic",
                reader_impact: "verification evidence unavailable",
                applied_effect,
                owner,
                action,
                evidence_ref
              }
            ]' "$RESULT_OUTPUT_PATH" > "$details_file"
            append_detail_table "$details_file"
          }

          append_policy_details() {
            details_file="$work_dir/policy-details.json"
            jq -n \
              --slurpfile policy "$RESULT_POLICY_PATH" \
              --slurpfile observations "$observations" \
              --slurpfile records "$RESULT_OUTPUT_PATH" '
              [
                $policy[0].expected_checks[] as $expected |
                ($records | map(select(.check_id == $expected.check_id)) | first) as $record |
                ($observations[0] | map(select(.check_id == $expected.check_id)) | first) as $observation |
                {
                  check_id: $record.check_id,
                  observed_state: $record.observed_state,
                  availability: $record.availability,
                  attribution: (
                    if $observation == null then "actions diagnostic"
                    else ($observation.attribution // "not provided")
                    end
                  ),
                  reader_impact: (
                    if $observation == null then "verification evidence unavailable"
                    elif (($observation.reader_impact // []) | length) > 0 then ($observation.reader_impact | join(", "))
                    else "none reported"
                    end
                  ),
                  applied_effect: $record.applied_effect,
                  owner: $record.owner,
                  action: $record.action,
                  evidence_ref: $record.evidence_ref
                }
              ]
            ' > "$details_file"
            append_detail_table "$details_file"
          }

          emit_contract_error() {
            check_id="$1"
            evidence_ref="$2"
            action="$3"
            message="$4"

            echo "::notice::$message" >&2
            jq -nc \
              --arg check_id "$check_id" \
              --arg tested_commit "$TESTED_COMMIT" \
              --arg tested_tree "$TESTED_TREE" \
              --arg evidence_ref "$evidence_ref" \
              --arg action "$action" '
              {
                contract_version: "wiki-verification-minimal.v1",
                check_id: $check_id,
                tested_commit: $tested_commit,
                tested_tree: $tested_tree,
                comparison_commit: null,
                comparison_tree: null,
                observed_state: "not_evaluated",
                availability: "unavailable",
                applied_effect: "block",
                owner: "actions-maintainers",
                action: $action,
                evidence_ref: $evidence_ref
              }
            ' > "$candidate"
            mv "$candidate" "$RESULT_OUTPUT_PATH"
            candidate=""
            write_result evidence_unavailable "[\"$check_id\"]" "[\"$check_id\"]" "[]"
            append_actions_details
            exit 0
          }

          if [ ! -f "$RESULT_POLICY_PATH" ]; then
            emit_contract_error \
              actions.policy \
              actions:invalid-policy \
              "provide a valid wiki-verification-policy.v1 file and rerun" \
              "Verification policy not found: $RESULT_POLICY_PATH"
          fi

          if ! jq -s -e --arg target "$VERIFICATION_TARGET" '
            def effect: . == "none" or . == "advisory" or . == "block";
            def check_id: type == "string" and test("^[a-z0-9]+([._-][a-z0-9]+)*$");
            length == 1 and
            (.[0] |
              type == "object" and
              ((keys_unsorted | sort) == (["contract_version", "expected_checks", "policy_id", "policy_version", "target"] | sort)) and
              .contract_version == "wiki-verification-policy.v1" and
              (.policy_id | type == "string" and length > 0) and
              (.policy_version | type == "string" and length > 0) and
              .target == $target and
              (.expected_checks | type == "array" and length > 0) and
              all(.expected_checks[];
                type == "object" and
                ((keys_unsorted | sort) == (["action", "applicability", "check_id", "on_partial", "on_unavailable", "on_violation", "owner"] | sort)) and
                (.check_id | check_id) and
                (.applicability == "required" or .applicability == "optional") and
                (.on_violation | effect) and
                (.on_partial | effect) and
                (.on_unavailable | effect) and
                (.owner | type == "string" and length > 0) and
                (.action | type == "string" and length > 0)
              ) and
              ([.expected_checks[].check_id] | length == (unique | length))
            )
          ' "$RESULT_POLICY_PATH" >/dev/null; then
            emit_contract_error \
              actions.policy \
              actions:invalid-policy \
              "repair the caller-owned verification policy and rerun" \
              "Verification policy does not match wiki-verification-policy.v1 or its target."
          fi

          observations="$work_dir/observations.json"

          set -- "$RESULT_RECORDS_DIR"/*.json
          if [ -e "$1" ]; then
            if ! jq -s '.' "$@" > "$observations"; then
              emit_contract_error \
                actions.contract \
                actions:invalid-observation-set \
                "repair the malformed verification observations and rerun" \
                "Could not read verification observations."
            fi
          else
            printf '[]\n' > "$observations"
          fi

          expected_ids="$(jq -c '[.expected_checks[].check_id]' "$RESULT_POLICY_PATH")"
          if ! jq -e \
            --arg tested_commit "$TESTED_COMMIT" \
            --arg tested_tree "$TESTED_TREE" \
            --argjson expected_ids "$expected_ids" '
            def git_oid: type == "string" and test("^[0-9a-f]{40}$");
            def check_id: type == "string" and test("^[a-z0-9]+([._-][a-z0-9]+)*$");
            def required_keys: [
              "availability", "check_id", "comparison_commit", "comparison_tree",
              "evidence_ref", "observation_version", "observed_state", "tested_commit", "tested_tree"
            ];
            def allowed_keys: required_keys + ["attribution", "reader_impact"];
            type == "array" and
            all(.[];
              type == "object" and
              ((required_keys - keys_unsorted) | length == 0) and
              ((keys_unsorted - allowed_keys) | length == 0) and
              .observation_version == "wiki-verification-observation.v1" and
              (.check_id | check_id) and
              .tested_commit == $tested_commit and
              .tested_tree == $tested_tree and
              ((.comparison_commit == null and .comparison_tree == null) or
                ((.comparison_commit | git_oid) and (.comparison_tree | git_oid))) and
              (.observed_state == "satisfied" or .observed_state == "violated" or .observed_state == "not_evaluated") and
              (.availability == "available" or .availability == "partial" or .availability == "unavailable") and
              (.evidence_ref | type == "string" and length > 0) and
              ((has("attribution") | not) or (.attribution | type == "string" and length > 0)) and
              ((has("reader_impact") | not) or
                (.reader_impact | type == "array" and all(.[]; type == "string" and length > 0) and length == (unique | length)))
            ) and
            ([.[].check_id] | length == (unique | length)) and
            ([.[].check_id] - $expected_ids | length == 0) and
            ([.[] | select(.comparison_commit != null) | [.comparison_commit, .comparison_tree]] | unique | length <= 1)
          ' "$observations" >/dev/null; then
            emit_contract_error \
              actions.contract \
              actions:invalid-observation-set \
              "repair the verification observation set and rerun" \
              "Observations must be unique, policy-known, fact-only records with exact run identities."
          fi

          if ! jq -e '
            all(.[];
              (.availability == "available" and
                (.observed_state == "satisfied" or .observed_state == "violated")) or
              (.availability == "partial") or
              (.availability == "unavailable" and .observed_state == "not_evaluated")
            )
          ' "$observations" >/dev/null; then
            emit_contract_error \
              actions.contract \
              actions:invalid-observation-set \
              "repair the invalid observation state and availability pair and rerun" \
              "An observation has an invalid state and availability combination."
          fi

          jq -c \
            --arg tested_commit "$TESTED_COMMIT" \
            --arg tested_tree "$TESTED_TREE" \
            --slurpfile observations "$observations" '
            def effect_rank:
              if . == "none" then 0 elif . == "advisory" then 1 else 2 end;
            def max_effect($left; $right):
              if ($left | effect_rank) >= ($right | effect_rank) then $left else $right end;
            def applied_effect($policy; $observation):
              if $observation.availability == "available" and $observation.observed_state == "satisfied" then "none"
              elif $observation.availability == "available" and $observation.observed_state == "violated" then $policy.on_violation
              elif $observation.availability == "partial" and $observation.observed_state == "violated" then max_effect($policy.on_partial; $policy.on_violation)
              elif $observation.availability == "partial" then $policy.on_partial
              else $policy.on_unavailable
              end;
            def comparison:
              ($observations[0] | map(select(.comparison_commit != null)) | first) //
              {comparison_commit: null, comparison_tree: null};
            .expected_checks[] as $policy |
            ($observations[0] | map(select(.check_id == $policy.check_id)) | first) as $observation |
            if $observation == null then
              {
                contract_version: "wiki-verification-minimal.v1",
                check_id: $policy.check_id,
                tested_commit: $tested_commit,
                tested_tree: $tested_tree,
                comparison_commit: comparison.comparison_commit,
                comparison_tree: comparison.comparison_tree,
                observed_state: "not_evaluated",
                availability: "unavailable",
                applied_effect: "block",
                owner: "actions-maintainers",
                action: "produce the missing verification observation and rerun",
                evidence_ref: "actions:missing-result"
              }
            else
              {
                contract_version: "wiki-verification-minimal.v1",
                check_id: $policy.check_id,
                tested_commit: $observation.tested_commit,
                tested_tree: $observation.tested_tree,
                comparison_commit: $observation.comparison_commit,
                comparison_tree: $observation.comparison_tree,
                observed_state: $observation.observed_state,
                availability: $observation.availability,
                applied_effect: applied_effect($policy; $observation),
                owner: $policy.owner,
                action: $policy.action,
                evidence_ref: $observation.evidence_ref
              }
            end
          ' "$RESULT_POLICY_PATH" > "$candidate"

          if ! jq -s -e \
            --arg tested_commit "$TESTED_COMMIT" \
            --arg tested_tree "$TESTED_TREE" '
            def git_oid: type == "string" and test("^[0-9a-f]{40}$");
            def check_id: type == "string" and test("^[a-z0-9]+([._-][a-z0-9]+)*$");
            def exact_keys: [
              "action", "applied_effect", "availability", "check_id", "comparison_commit",
              "comparison_tree", "contract_version", "evidence_ref", "observed_state", "owner",
              "tested_commit", "tested_tree"
            ];
            type == "array" and length > 0 and
            all(.[];
              type == "object" and
              ((keys_unsorted | sort) == (exact_keys | sort)) and
              .contract_version == "wiki-verification-minimal.v1" and
              (.check_id | check_id) and
              .tested_commit == $tested_commit and (.tested_commit | git_oid) and
              .tested_tree == $tested_tree and (.tested_tree | git_oid) and
              ((.comparison_commit == null and .comparison_tree == null) or
                ((.comparison_commit | git_oid) and (.comparison_tree | git_oid))) and
              (.observed_state == "satisfied" or .observed_state == "violated" or .observed_state == "not_evaluated") and
              (.availability == "available" or .availability == "partial" or .availability == "unavailable") and
              (.applied_effect == "none" or .applied_effect == "advisory" or .applied_effect == "block") and
              (.owner | type == "string" and length > 0) and
              (.action | type == "string" and length > 0) and
              (.evidence_ref | type == "string" and length > 0)
            )
          ' "$candidate" >/dev/null; then
            emit_contract_error \
              actions.contract \
              actions:invalid-minimal-records \
              "repair the verification contract collector and rerun" \
              "The collector produced records that do not match wiki-verification-minimal.v1."
          fi

          mv "$candidate" "$RESULT_OUTPUT_PATH"
          candidate=""

          blocking_checks="$(jq -sc '[.[] | select(.applied_effect == "block") | .check_id]' "$RESULT_OUTPUT_PATH")"
          unavailable_checks="$(jq -sc '[.[] | select(.availability != "available") | .check_id]' "$RESULT_OUTPUT_PATH")"
          advisory_checks="$(jq -sc '[.[] | select(.applied_effect == "advisory") | .check_id]' "$RESULT_OUTPUT_PATH")"
          blocking_violations="$(jq -sc '[.[] | select(.applied_effect == "block" and .observed_state == "violated")] | length' "$RESULT_OUTPUT_PATH")"
          blocking_unavailable="$(jq -sc '[.[] | select(.applied_effect == "block" and .availability != "available" and .observed_state != "violated")] | length' "$RESULT_OUTPUT_PATH")"
          advisory_count="$(jq -sc '[.[] | select(.applied_effect == "advisory")] | length' "$RESULT_OUTPUT_PATH")"

          if [ "$blocking_violations" -gt 0 ]; then
            result_conclusion=blocked
          elif [ "$blocking_unavailable" -gt 0 ]; then
            result_conclusion=evidence_unavailable
          elif [ "$advisory_count" -gt 0 ]; then
            result_conclusion=trusted_with_advisories
          else
            result_conclusion=trusted
          fi

          write_result "$result_conclusion" "$blocking_checks" "$unavailable_checks" "$advisory_checks"
          append_policy_details

      - name: Enforce verification contract
        if: always() && inputs['result-contract-mode'] == 'enforce'
        shell: sh
        env:
          RESULT_CONCLUSION: ${{ steps.verification_contract.outputs['result-conclusion'] }}
        run: |
          set -eu

          case "$RESULT_CONCLUSION" in
            trusted|trusted_with_advisories)
              exit 0
              ;;
            blocked)
              echo "::error::Verification policy found a blocking defect."
              ;;
            evidence_unavailable)
              echo "::error::Required verification evidence is unavailable."
              ;;
            *)
              echo "::error::Verification contract did not produce a valid conclusion."
              ;;
          esac

          exit 1

      - name: Enforce remote link result
        if: always() && inputs['result-contract-mode'] != 'enforce'
        env:
          LINK_LINUX_INSTALL_OUTCOME: ${{ steps.link_check_linux_install.outcome }}
          LINK_LINUX_PREINSTALLED_OUTCOME: ${{ steps.link_check_linux_preinstalled.outcome }}
          LINK_MACOS_OUTCOME: ${{ steps.link_check_macos.outcome }}
        run: |
          set -eu

          for outcome in "${LINK_LINUX_INSTALL_OUTCOME:-}" "${LINK_LINUX_PREINSTALLED_OUTCOME:-}" "${LINK_MACOS_OUTCOME:-}"; do
            case "$outcome" in
              failure|cancelled)
                echo "::error::Remote link verification failed. Repair the affected URL or recheck it with successful remote-verifier evidence."
                exit 1
                ;;
            esac
          done
