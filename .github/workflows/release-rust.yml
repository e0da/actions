name: Release Rust

on:
  workflow_call:
    inputs:
      binary-name:
        required: true
        type: string
      cargo-package:
        required: false
        type: string
        default: ""
      targets:
        required: false
        type: string
        default: "aarch64-apple-darwin,x86_64-unknown-linux-musl"
      validate-runner:
        required: false
        type: string
        default: ubuntu-latest
      linux-x64-runner:
        required: false
        type: string
        default: ubuntu-latest
      linux-arm64-runner:
        required: false
        type: string
        default: puck-linux-arm64
      publish-runner:
        required: false
        type: string
        default: ubuntu-latest
      image-runner:
        required: false
        type: string
        default: ubuntu-latest
      smoke-command:
        required: false
        type: string
        default: ""
      push-image:
        required: false
        type: boolean
        default: false
    secrets:
      GHCR_TOKEN:
        required: false

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ${{ inputs.validate-runner }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      build-matrix: ${{ steps.meta.outputs.build-matrix }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install rustup when missing
        shell: sh
        run: |
          set -eu
          if command -v rustup >/dev/null 2>&1; then
            rustup --version
            exit 0
          fi

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://sh.rustup.rs \
            --output "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install Rust metadata toolchain
        shell: sh
        env:
          RUST_TOOLCHAIN: stable
        run: |
          set -eu

          rust_metadata_toolchain_ready() {
            rustup run "$RUST_TOOLCHAIN" rustc --version >/dev/null 2>&1 || return 1
            rustup run "$RUST_TOOLCHAIN" cargo --version >/dev/null 2>&1 || return 1
          }

          install_rust_toolchain() {
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          }

          if rust_metadata_toolchain_ready; then
            printf '%s\n' "Using preinstalled Rust metadata toolchain: $RUST_TOOLCHAIN"
            rustup default "$RUST_TOOLCHAIN"
            exit 0
          fi

          attempt=1
          while [ "$attempt" -le 3 ]; do
            if install_rust_toolchain; then
              rustup default "$RUST_TOOLCHAIN"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              printf '%s\n' "rustup install failed after ${attempt} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 15))
            printf '%s\n' "rustup install attempt ${attempt} failed; retrying in ${sleep_seconds}s" >&2
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Validate tag matches Cargo package version
        id: meta
        shell: sh
        env:
          CARGO_PACKAGE: ${{ inputs.cargo-package }}
          TARGETS: ${{ inputs.targets }}
          LINUX_ARM64_RUNNER: ${{ inputs.linux-arm64-runner }}
          LINUX_X64_RUNNER: ${{ inputs.linux-x64-runner }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if [ -n "$CARGO_PACKAGE" ]; then
            pkgid="$(cargo pkgid -p "$CARGO_PACKAGE")"
          else
            pkgid="$(cargo pkgid)"
          fi
          version="${pkgid##*@}"
          expected_tag="v${version}"

          if [ "$tag" != "$expected_tag" ]; then
            echo "release tag mismatch: expected ${expected_tag}, got ${tag}" >&2
            exit 1
          fi

          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-((pre|alpha|beta|rc)\.[0-9]+))?$'; then
            echo "version is not on a supported release train: ${version}" >&2
            exit 1
          fi

          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac

          normalized_targets="$(printf '%s' "$TARGETS" | tr -d '[:space:]')"
          old_ifs=$IFS
          IFS=,
          for target in $normalized_targets; do
            case "$target" in
              aarch64-apple-darwin|aarch64-unknown-linux-musl|x86_64-unknown-linux-musl|"") ;;
              *)
                echo "unsupported release target: ${target}" >&2
                exit 1
                ;;
            esac
          done
          IFS=$old_ifs

          json_escape() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }

          matrix_json='{"include":['
          matrix_sep=
          matrix_count=0
          add_target() {
            matrix_target="$1"
            matrix_os="$2"
            matrix_json="${matrix_json}${matrix_sep}{\"target\":\"${matrix_target}\",\"os\":${matrix_os}}"
            matrix_sep=,
            matrix_count=$((matrix_count + 1))
          }

          requested_targets=",${normalized_targets},"
          case "$requested_targets" in
            *,aarch64-apple-darwin,*)
              add_target "aarch64-apple-darwin" '["self-hosted","macos","ARM64"]'
              ;;
          esac
          case "$requested_targets" in
            *,aarch64-unknown-linux-musl,*)
              escaped_runner="$(json_escape "$LINUX_ARM64_RUNNER")"
              add_target "aarch64-unknown-linux-musl" "\"${escaped_runner}\""
              ;;
          esac
          case "$requested_targets" in
            *,x86_64-unknown-linux-musl,*)
              escaped_runner="$(json_escape "$LINUX_X64_RUNNER")"
              add_target "x86_64-unknown-linux-musl" "\"${escaped_runner}\""
              ;;
          esac

          if [ "$matrix_count" -eq 0 ]; then
            echo "at least one release target is required" >&2
            exit 1
          fi

          build_matrix="${matrix_json}]}"

          echo "validated ${tag} -> ${version} (prerelease=${prerelease})"
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "build-matrix=${build_matrix}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.build-matrix) }}

    runs-on: ${{ matrix.os }}

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install rustup when missing
        shell: sh
        run: |
          set -eu
          if command -v rustup >/dev/null 2>&1; then
            rustup --version
            exit 0
          fi

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://sh.rustup.rs \
            --output "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install Rust toolchain
        shell: sh
        env:
          RUST_TOOLCHAIN: stable
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -eu

          rust_target_toolchain_ready() {
            rustup run "$RUST_TOOLCHAIN" rustc --version >/dev/null 2>&1 || return 1
            rustup run "$RUST_TOOLCHAIN" cargo --version >/dev/null 2>&1 || return 1
            rustup target list --toolchain "$RUST_TOOLCHAIN" --installed \
              | grep -Fx "$RUST_TARGET" >/dev/null 2>&1 || return 1
          }

          install_rust_toolchain() {
            rustup toolchain install "$RUST_TOOLCHAIN" \
              --profile minimal \
              --target "$RUST_TARGET"
          }

          if rust_target_toolchain_ready; then
            printf '%s\n' "Using preinstalled Rust target toolchain: $RUST_TOOLCHAIN / $RUST_TARGET"
            rustup default "$RUST_TOOLCHAIN"
            exit 0
          fi

          attempt=1
          while [ "$attempt" -le 3 ]; do
            if install_rust_toolchain; then
              rustup default "$RUST_TOOLCHAIN"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              printf '%s\n' "rustup install failed after ${attempt} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 15))
            printf '%s\n' "rustup install attempt ${attempt} failed; retrying in ${sleep_seconds}s" >&2
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Add musl toolchain (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        shell: sh
        run: |
          set -eu
          if command -v sudo >/dev/null 2>&1; then
            sudo_cmd=sudo
          else
            sudo_cmd=
          fi

          if command -v apt-get >/dev/null 2>&1; then
            $sudo_cmd apt-get update -q
            $sudo_cmd apt-get install -y musl-tools
          elif command -v apk >/dev/null 2>&1; then
            $sudo_cmd apk add --no-cache build-base musl-dev
          else
            echo "unsupported Linux package manager for musl target setup" >&2
            exit 1
          fi

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-${{ runner.os }}-${{ matrix.target }}
          cache-bin: "false"

      - name: Build release binary
        shell: sh
        env:
          CARGO_PACKAGE: ${{ inputs.cargo-package }}
        run: |
          set -eu
          if [ -n "$CARGO_PACKAGE" ]; then
            set -- -p "$CARGO_PACKAGE"
          else
            set --
          fi
          cargo build --release --locked --target ${{ matrix.target }} "$@"

      - name: Smoke test (native targets only)
        if: inputs.smoke-command != '' && matrix.target == 'aarch64-apple-darwin' && runner.os == 'macOS'
        run: ${{ inputs.smoke-command }}

      - name: Package binary
        id: package
        shell: sh
        run: |
          set -eu
          binary="${{ inputs.binary-name }}"
          target="${{ matrix.target }}"
          version="${{ needs.validate.outputs.version }}"
          archive="${binary}-${version}-${target}.tar.gz"

          cp "target/${target}/release/${binary}" "${binary}"
          tar czf "${archive}" "${binary}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ${{ inputs.publish-runner }}
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ needs.validate.outputs.prerelease }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256

  push-image:
    name: Push Container Image
    needs: [validate, build]
    if: inputs.push-image
    runs-on: ${{ inputs.image-runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/e0da/${{ inputs.binary-name }}:${{ needs.validate.outputs.version }}
            ghcr.io/e0da/${{ inputs.binary-name }}:latest
