name: Deploy Compose Service

# Reusable workflow that deploys an e0da/stack service on the puck self-hosted
# runner. Implements ADR-016 archetypes A/B/C/D.
#
# Archetypes:
#   A — static-bind:   rsync a build artifact directory into a host bind path
#                      (no container restart needed; bind-mount is live).
#   B — ghcr-image:    docker compose pull && up -d --wait (image built upstream).
#                      Set skip-pull when another workflow already delivered
#                      the image and this deploy only applies compose/env state.
#   C — local-build:   docker compose build && up -d --wait (Dockerfile in tree).
#   D — upstream-only: docker compose pull && up -d --wait (upstream image).
#
# Secrets handling: if `env-file-encrypted` is set, the file is sops-decrypted
# on the runner using the in-place age key, written to `<stack-path>/.env`,
# and removed via trap on exit. Plaintext .env never leaves the runner host.
#
on:
  workflow_call:
    inputs:
      service:
        description: "Service name (matches stack/<service>/ directory)"
        required: true
        type: string
      archetype:
        description: "Deploy archetype: A | B | C | D"
        required: true
        type: string
      stack-path:
        description: "Absolute path on puck containing compose.yaml"
        required: true
        type: string
      artifact-name:
        description: "Name of the uploaded build artifact (archetype A only)"
        required: false
        type: string
        default: ""
      artifact-source-dir:
        description: "Subdirectory of the downloaded artifact to rsync (archetype A)"
        required: false
        type: string
        default: "."
      bind-target:
        description: "Absolute target path on puck for rsync (archetype A only)"
        required: false
        type: string
        default: ""
      env-file-encrypted:
        description: "Path to sops-encrypted env file relative to stack-path (e.g. .env.enc.yaml). Empty = no env decryption."
        required: false
        type: string
        default: ""
      env-file-format:
        description: "sops input format: dotenv (raw KEY=val), yaml (KEY: val pairs decoded via sops --output-type=dotenv), yaml-helper (KEY: val pairs piped through stack-path/yaml2env.py)."
        required: false
        type: string
        default: "dotenv"
      healthcheck-command:
        description: "Optional shell command to verify service health post-deploy. Non-zero exit fails the job."
        required: false
        type: string
        default: ""
      skip-pull:
        description: "Skip docker compose pull for archetypes B/D and only run docker compose up -d --wait."
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    runs-on: [self-hosted, puck]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Validate archetype
        shell: bash
        run: |
          case "${{ inputs.archetype }}" in
            A|B|C|D) echo "archetype=${{ inputs.archetype }}" ;;
            *) echo "invalid archetype: ${{ inputs.archetype }}" >&2; exit 1 ;;
          esac

      - name: Validate archetype-specific inputs
        shell: bash
        run: |
          arch="${{ inputs.archetype }}"
          if [[ "$arch" == "A" ]]; then
            if [[ -z "${{ inputs.artifact-name }}" || -z "${{ inputs.bind-target }}" ]]; then
              echo "archetype A requires both artifact-name and bind-target" >&2
              exit 1
            fi
          fi

      - name: Refresh stack working tree
        if: inputs.archetype != 'A'
        shell: bash
        env:
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          # Ensure the on-disk repo containing stack-path is current before
          # docker compose reads compose.yaml. The deploy-compose reusable
          # workflow operates on a long-lived working tree on puck rather
          # than a fresh checkout, so refresh it explicitly. Find the git
          # root by walking up from stack-path.
          stack_path="${{ inputs.stack-path }}"
          if [[ ! -d "$stack_path" ]]; then
            echo "stack-path does not exist on runner: $stack_path" >&2
            exit 1
          fi
          repo_root="$(cd "$stack_path" && git rev-parse --show-toplevel 2>/dev/null || true)"
          if [[ -z "$repo_root" ]]; then
            echo "warning: $stack_path is not inside a git repo; skipping refresh" >&2
            exit 0
          fi
          cd "$repo_root"
          git fetch --quiet origin main
          git reset --hard origin/main
          echo "$repo_root synced to $(git rev-parse --short HEAD)"

      - name: Download artifact (archetype A)
        if: inputs.archetype == 'A' && inputs.artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: _artifact

      - name: Decrypt env file
        if: inputs.env-file-encrypted != ''
        shell: bash
        env:
          SOPS_AGE_KEY_FILE: /Users/e0da/.config/sops/age/keys.txt
        run: |
          set -euo pipefail
          stack_path="${{ inputs.stack-path }}"
          enc="${stack_path}/${{ inputs.env-file-encrypted }}"
          out="${stack_path}/.env"
          if [[ ! -f "$enc" ]]; then
            echo "encrypted env file not found: $enc" >&2
            exit 1
          fi
          case "${{ inputs.env-file-format }}" in
            dotenv)
              sops --decrypt "$enc" > "$out"
              ;;
            yaml)
              sops --decrypt --output-type=dotenv "$enc" > "$out"
              ;;
            yaml-helper)
              if [[ ! -f "${stack_path}/yaml2env.py" ]]; then
                echo "yaml-helper format requires ${stack_path}/yaml2env.py helper" >&2
                exit 1
              fi
              sops --decrypt "$enc" | python3 "${stack_path}/yaml2env.py" > "$out"
              ;;
            *)
              echo "unsupported env-file-format: ${{ inputs.env-file-format }}" >&2
              exit 1
              ;;
          esac
          chmod 600 "$out"
          echo "decrypted env to $out"

      - name: Apply (archetype A — static-bind rsync)
        if: inputs.archetype == 'A'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.bind-target }}"
          source="_artifact/${{ inputs.artifact-source-dir }}"
          mkdir -p "$target"
          rsync -av --delete "${source%/}/" "${target%/}/"
          echo "rsynced $source → $target"

      - name: Prepare ephemeral DOCKER_CONFIG
        if: inputs.archetype != 'A'
        id: docker-config
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Bypass the host's credsStore (Docker Desktop credential helper hangs
          # in non-GUI launchd context). Use an ephemeral DOCKER_CONFIG dir with
          # an explicit auth entry for ghcr.io built from GITHUB_TOKEN.
          #
          # Docker resolves cli-plugins (e.g. compose) under DOCKER_CONFIG/cli-plugins,
          # so symlink the host's cli-plugins dir into our ephemeral config so
          # `docker compose` is still discoverable.
          dc="$(mktemp -d -t docker-config-XXXX)"
          token_b64="$(printf '%s:%s' "${GITHUB_ACTOR}" "${GH_TOKEN}" | base64)"
          cat > "$dc/config.json" <<JSON
          {
            "auths": {
              "ghcr.io": { "auth": "${token_b64}" }
            }
          }
          JSON
          chmod 600 "$dc/config.json"
          if [[ -d "$HOME/.docker/cli-plugins" ]]; then
            ln -s "$HOME/.docker/cli-plugins" "$dc/cli-plugins"
            echo "symlinked cli-plugins from $HOME/.docker/cli-plugins"
          else
            echo "warning: $HOME/.docker/cli-plugins not found; docker compose may be unavailable" >&2
          fi
          echo "dir=$dc" >> "$GITHUB_OUTPUT"
          echo "wrote ephemeral DOCKER_CONFIG at $dc"

      - name: Apply (archetype B — ghcr image pull + up)
        if: inputs.archetype == 'B'
        shell: bash
        env:
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin
          DOCKER_CONFIG: ${{ steps.docker-config.outputs.dir }}
          DOCKER_HOST: unix:///Users/e0da/.docker/run/docker.sock
        run: |
          set -euo pipefail
          cd "${{ inputs.stack-path }}"
          if [[ "${{ inputs.skip-pull }}" == "true" ]]; then
            echo "skip-pull=true; skipping docker compose pull"
          else
            docker compose pull
          fi
          docker compose up -d --wait

      - name: Apply (archetype C — local build + up)
        if: inputs.archetype == 'C'
        shell: bash
        env:
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin
          DOCKER_CONFIG: ${{ steps.docker-config.outputs.dir }}
          DOCKER_HOST: unix:///Users/e0da/.docker/run/docker.sock
        run: |
          set -euo pipefail
          cd "${{ inputs.stack-path }}"
          docker compose build
          docker compose up -d --wait

      - name: Apply (archetype D — upstream image pull + up)
        if: inputs.archetype == 'D'
        shell: bash
        env:
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin
          DOCKER_CONFIG: ${{ steps.docker-config.outputs.dir }}
          DOCKER_HOST: unix:///Users/e0da/.docker/run/docker.sock
        run: |
          set -euo pipefail
          cd "${{ inputs.stack-path }}"
          if [[ "${{ inputs.skip-pull }}" == "true" ]]; then
            echo "skip-pull=true; skipping docker compose pull"
          else
            docker compose pull
          fi
          docker compose up -d --wait

      - name: Cleanup ephemeral DOCKER_CONFIG
        if: always() && steps.docker-config.outputs.dir != ''
        shell: bash
        run: |
          rm -rf "${{ steps.docker-config.outputs.dir }}" || true

      - name: Healthcheck
        if: inputs.healthcheck-command != ''
        shell: bash
        env:
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          cd "${{ inputs.stack-path }}"
          ${{ inputs.healthcheck-command }}

      - name: Cleanup decrypted env
        if: always() && inputs.env-file-encrypted != ''
        shell: bash
        run: |
          rm -f "${{ inputs.stack-path }}/.env"
          echo "removed decrypted env"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Deploy: ${{ inputs.service }}"
            echo ""
            echo "- archetype: ${{ inputs.archetype }}"
            echo "- stack-path: \`${{ inputs.stack-path }}\`"
            echo "- apply: true"
            echo "- skip-pull: ${{ inputs.skip-pull }}"
          } >> "$GITHUB_STEP_SUMMARY"
