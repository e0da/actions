name: Reusable OpenTofu CI

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for the OpenTofu job."
        required: false
        type: string
        default: ubuntu-latest
      runner-profile:
        description: "Optional runner profile metadata for future validation; does not affect scheduling."
        required: false
        type: string
        default: ""
      runner-capabilities:
        description: "Optional requested runner capability metadata for future validation."
        required: false
        type: string
        default: ""
      runner-manifest:
        description: "Optional puck-linux-runner-image-contract.v1 JSON used to validate requested runner capabilities."
        required: false
        type: string
        default: ""
      tofu-version:
        description: "OpenTofu version passed to opentofu/setup-opentofu."
        required: false
        type: string
        default: latest
      fmt-command:
        description: "Command that checks OpenTofu formatting."
        required: false
        type: string
        default: "tofu fmt -check -recursive"
      validate-command:
        description: "Command that initializes and validates configurations."
        required: false
        type: string
        default: "make validate"
      provider-cache-mode:
        description: "Provider plugin cache policy. read-write restores/saves a GitHub cache; off skips cache setup."
        required: false
        type: string
        default: read-write
      provider-download-retry:
        description: "OpenTofu TF_PROVIDER_DOWNLOAD_RETRY value for retrying safe provider download failures."
        required: false
        type: string
        default: "3"
      registry-discovery-retry:
        description: "OpenTofu TF_REGISTRY_DISCOVERY_RETRY value for registry discovery requests."
        required: false
        type: string
        default: "3"
      registry-client-timeout:
        description: "OpenTofu TF_REGISTRY_CLIENT_TIMEOUT value in seconds."
        required: false
        type: string
        default: "30"
      go-debug:
        description: "GODEBUG value for OpenTofu's Go runtime. Defaults to disabling HTTP/2 client transport for provider downloads."
        required: false
        type: string
        default: "http2client=0"

jobs:
  opentofu:
    name: OpenTofu
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    env:
      GODEBUG: ${{ inputs.go-debug }}
      TF_IN_AUTOMATION: "1"
      TF_PROVIDER_DOWNLOAD_RETRY: ${{ inputs.provider-download-retry }}
      TF_REGISTRY_DISCOVERY_RETRY: ${{ inputs.registry-discovery-retry }}
      TF_REGISTRY_CLIENT_TIMEOUT: ${{ inputs.registry-client-timeout }}
    steps:
      - name: Validate runner contract
        env:
          RUNNER_PROFILE: ${{ inputs['runner-profile'] }}
          RUNNER_CAPABILITIES: ${{ inputs['runner-capabilities'] }}
          RUNNER_MANIFEST: ${{ inputs['runner-manifest'] }}
          PROVIDER_CACHE_MODE: ${{ inputs.provider-cache-mode }}
          PROVIDER_DOWNLOAD_RETRY: ${{ inputs.provider-download-retry }}
          REGISTRY_DISCOVERY_RETRY: ${{ inputs.registry-discovery-retry }}
          REGISTRY_CLIENT_TIMEOUT: ${{ inputs.registry-client-timeout }}
          OBSERVED_RUNNER_OS: ${{ runner.os }}
          OBSERVED_RUNNER_ARCH: ${{ runner.arch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu

          require_unsigned_integer() {
            name="$1"
            value="$2"

            case "$value" in
              ""|*[!0-9]*)
                echo "::error::${name} must be an unsigned integer, got '${value:-<missing>}.'"
                exit 1
                ;;
            esac
          }

          case "$RUNNER_PROFILE" in
            ""|hosted-linux|puck-linux-arm64|puck-macos-arm64) ;;
            *)
              echo "::error::Unknown runner-profile '${RUNNER_PROFILE}'. Expected one of: hosted-linux, puck-linux-arm64, puck-macos-arm64."
              exit 1
              ;;
          esac

          case "$PROVIDER_CACHE_MODE" in
            read-write|off) ;;
            *)
              echo "::error::Unknown provider-cache-mode '${PROVIDER_CACHE_MODE}'. Expected one of: read-write, off."
              exit 1
              ;;
          esac

          require_unsigned_integer provider-download-retry "$PROVIDER_DOWNLOAD_RETRY"
          require_unsigned_integer registry-discovery-retry "$REGISTRY_DISCOVERY_RETRY"
          require_unsigned_integer registry-client-timeout "$REGISTRY_CLIENT_TIMEOUT"

          require_runner() {
            expected_os="$1"
            expected_arch="${2:-}"

            if [ "$OBSERVED_RUNNER_OS" != "$expected_os" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.os '${expected_os}', got '${OBSERVED_RUNNER_OS}'."
              exit 1
            fi

            if [ -n "$expected_arch" ] && [ "$OBSERVED_RUNNER_ARCH" != "$expected_arch" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.arch '${expected_arch}', got '${OBSERVED_RUNNER_ARCH}'."
              exit 1
            fi
          }

          case "$RUNNER_PROFILE" in
            hosted-linux) require_runner Linux ;;
            puck-linux-arm64) require_runner Linux ARM64 ;;
            puck-macos-arm64) require_runner macOS ARM64 ;;
          esac

          validate_runner_manifest() {
            [ -n "$RUNNER_MANIFEST" ] || return 0

            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::runner-manifest was provided, but jq was not found."
              exit 1
            fi

            schema="$(printf '%s' "$RUNNER_MANIFEST" | jq -r '.schema_version // ""')"
            if [ "$schema" != "puck-linux-runner-image-contract.v1" ]; then
              echo "::error::runner-manifest schema_version must be puck-linux-runner-image-contract.v1, got '${schema:-<missing>}'."
              exit 1
            fi

            repo="${REPOSITORY#*/}"
            runner_entry="$(printf '%s' "$RUNNER_MANIFEST" | jq -c --arg repo "$repo" '.runners[]? | select(.runner_identity.repo == $repo)' | sed -n '1p')"
            if [ -z "$runner_entry" ]; then
              echo "::error::runner-manifest missing runners[].runner_identity.repo entry for '${repo}'."
              exit 1
            fi

            manifest_profile="$(printf '%s' "$runner_entry" | jq -r '.runner_identity.runner_profile // ""')"
            if [ -n "$RUNNER_PROFILE" ] && [ "$manifest_profile" != "$RUNNER_PROFILE" ]; then
              echo "::error::runner-manifest runner_identity.runner_profile expected '${RUNNER_PROFILE}', got '${manifest_profile:-<missing>}'."
              exit 1
            fi

            manifest_os="$(printf '%s' "$runner_entry" | jq -r '.intended_contract_state.runner_os // ""')"
            if [ -n "$manifest_os" ] && [ "$manifest_os" != "$OBSERVED_RUNNER_OS" ]; then
              echo "::error::runner-manifest intended_contract_state.runner_os expected '${OBSERVED_RUNNER_OS}', got '${manifest_os}'."
              exit 1
            fi

            manifest_arch="$(printf '%s' "$runner_entry" | jq -r '.intended_contract_state.runner_arch // ""')"
            if [ -n "$manifest_arch" ] && [ "$manifest_arch" != "$OBSERVED_RUNNER_ARCH" ]; then
              echo "::error::runner-manifest intended_contract_state.runner_arch expected '${OBSERVED_RUNNER_ARCH}', got '${manifest_arch}'."
              exit 1
            fi

            if [ "$manifest_profile" = "puck-linux-arm64" ]; then
              runner_local_bin_path="$(printf '%s' "$runner_entry" | jq -r '.path_policy.runner_local_bin.path // ""')"
              if [ "$runner_local_bin_path" != "/runner/.local/bin" ]; then
                echo "::error::runner-manifest path_policy.runner_local_bin.path expected '/runner/.local/bin', got '${runner_local_bin_path:-<missing>}'."
                exit 1
              fi

              runner_local_bin_state="$(printf '%s' "$runner_entry" | jq -r '.path_policy.runner_local_bin.state // ""')"
              if [ "$runner_local_bin_state" != "directory" ]; then
                echo "::error::runner-manifest path_policy.runner_local_bin.state expected 'directory', got '${runner_local_bin_state:-<missing>}'."
                exit 1
              fi

              if ! printf '%s' "$runner_entry" | jq -e '.path_policy.runner_local_bin.in_path == true' >/dev/null; then
                runner_local_bin_in_path="$(printf '%s' "$runner_entry" | jq -r '.path_policy.runner_local_bin.in_path // false')"
                echo "::error::runner-manifest path_policy.runner_local_bin.in_path expected boolean true, got '${runner_local_bin_in_path}'."
                exit 1
              fi
            fi

            for capability in $RUNNER_CAPABILITIES; do
              tool_status="$(printf '%s' "$runner_entry" | jq -r --arg name "$capability" '([.tools[]? | select(.name == $name)] | first | .observed.status) // "missing-tool-entry"')"
              if [ "$tool_status" != "present" ]; then
                echo "::error::runner-manifest tools.${capability}.observed.status expected 'present', got '${tool_status}'."
                exit 1
              fi

              tool_version="$(printf '%s' "$runner_entry" | jq -r --arg name "$capability" '([.tools[]? | select(.name == $name)] | first | .observed.version) // ""')"
              if [ -z "$tool_version" ]; then
                echo "::error::runner-manifest tools.${capability}.observed.version expected a non-empty version."
                exit 1
              fi
            done
          }

          for capability in $RUNNER_CAPABILITIES; do
            case "$capability" in
              gh|ruby|brew|make)
                if ! command -v "$capability" >/dev/null 2>&1; then
                  echo "::error::runner-capabilities requested '${capability}', but command '${capability}' was not found."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Unknown runner-capabilities token '${capability}'. Expected one of: gh, ruby, brew, make."
                exit 1
                ;;
            esac
          done

          validate_runner_manifest

          echo "Runner contract OK: profile='${RUNNER_PROFILE:-<none>}' capabilities='${RUNNER_CAPABILITIES:-<none>}' os='${OBSERVED_RUNNER_OS}' arch='${OBSERVED_RUNNER_ARCH}'."

      - uses: actions/checkout@v5

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false

      - name: Prepare OpenTofu provider cache
        if: inputs.provider-cache-mode == 'read-write'
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.opentofu/plugin-cache
        shell: sh
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          printf 'TF_PLUGIN_CACHE_DIR=%s\n' "$TF_PLUGIN_CACHE_DIR" >> "$GITHUB_ENV"

      - name: Cache OpenTofu providers
        if: inputs.provider-cache-mode == 'read-write'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.opentofu/plugin-cache
          key: opentofu-provider-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tofu-version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            opentofu-provider-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tofu-version }}-

      - name: Check formatting
        env:
          FMT_COMMAND: ${{ inputs.fmt-command }}
        shell: sh
        run: sh -c "$FMT_COMMAND"

      - name: Validate
        env:
          VALIDATE_COMMAND: ${{ inputs.validate-command }}
        shell: sh
        run: sh -c "$VALIDATE_COMMAND"
