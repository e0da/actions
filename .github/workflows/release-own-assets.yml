name: Release own repository assets

on:
  workflow_call:
    inputs:
      runner:
        description: Runner for the build and smoke tests.
        required: true
        type: string
      build-command:
        description: Build and test the release, writing only release assets to RUNNER_TEMP/dist.
        required: true
        type: string

defaults:
  run:
    shell: sh

jobs:
  build:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a tag on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - uses: jdx/mise-action@v2
      - name: Build and test release assets
        run: ${{ inputs.build-command }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish assets to the caller's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
