name: Reusable Jekyll CI

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for the Jekyll job."
        required: false
        type: string
        default: ubuntu-latest
      ruby-version:
        description: "Ruby version passed to ruby/setup-ruby."
        required: false
        type: string
        default: "3.2"
      build-command:
        description: "Command that builds the Jekyll site."
        required: false
        type: string
        default: "bundle exec jekyll build --strict_front_matter"
      test-command:
        description: "Optional command that runs repository-specific site checks after build."
        required: false
        type: string
        default: ""

jobs:
  jekyll:
    name: Jekyll
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Ruby tool cache
        if: runner.os == 'macOS'
        run: mkdir -p "$RUNNER_TEMP/ruby-tool-cache"

      - name: Set up Ruby
        if: runner.os != 'macOS'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs['ruby-version'] }}
          bundler-cache: true

      - name: Set up Ruby
        if: runner.os == 'macOS'
        uses: ruby/setup-ruby@v1
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/ruby-tool-cache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/ruby-tool-cache
        with:
          ruby-version: ${{ inputs['ruby-version'] }}
          bundler-cache: true

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo_cmd=""
            if command -v sudo >/dev/null 2>&1; then
              sudo_cmd="sudo"
            fi

            case "$(uname -s)" in
              Darwin)
                if ! command -v brew >/dev/null 2>&1; then
                  echo "Homebrew is required to install ripgrep on macOS self-hosted runners."
                  exit 1
                fi
                brew install ripgrep
                ;;
              Linux)
                if command -v apt-get >/dev/null 2>&1; then
                  $sudo_cmd apt-get update
                  $sudo_cmd apt-get install -y ripgrep
                elif command -v apk >/dev/null 2>&1; then
                  $sudo_cmd apk add --no-cache ripgrep
                else
                  echo "No supported package manager found for ripgrep."
                  exit 1
                fi
                ;;
              *)
                echo "No supported ripgrep install path for $(uname -s)."
                exit 1
                ;;
            esac
          fi

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs['build-command'] }}
        run: bash -lc "$BUILD_COMMAND"

      - name: Test
        env:
          TEST_COMMAND: ${{ inputs['test-command'] }}
        run: |
          if [ -z "$TEST_COMMAND" ]; then
            echo "No test command configured."
            exit 0
          fi

          bash -lc "$TEST_COMMAND"
