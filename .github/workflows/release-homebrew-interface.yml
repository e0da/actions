name: Release Homebrew Interface

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner for release-interface build and package proof."
        required: false
        type: string
        default: macos-14
      install-runner:
        description: "Runner for Homebrew installed proof."
        required: false
        type: string
        default: macos-14
      release-interface:
        description: "App-owned release interface script."
        required: false
        type: string
        default: scripts/release-interface
      build-output-dir:
        description: "Directory passed to the release-interface build verb."
        required: false
        type: string
        default: dist/homebrew-interface
      built-binary-name:
        description: "Binary name under build-output-dir/bin; defaults to homebrew-formula."
        required: false
        type: string
        default: ""
      artifact-name:
        description: "Base name for the uploaded release payload artifact."
        required: false
        type: string
        default: homebrew-interface-payload
      setup-bun:
        description: "Install Bun before running the release interface."
        required: false
        type: boolean
        default: false
      bun-version:
        description: "Bun version passed to oven-sh/setup-bun when setup-bun is true."
        required: false
        type: string
        default: latest
      bun-install-command:
        description: "Command run after Bun setup; set empty to skip dependency installation."
        required: false
        type: string
        default: bun install --frozen-lockfile
      release-env:
        description: "Optional newline-delimited KEY=VALUE entries exported before release-interface commands."
        required: false
        type: string
        default: ""
      homebrew-build-packages:
        description: "Optional newline-delimited Homebrew packages required before build/test."
        required: false
        type: string
        default: ""
      publish-runner:
        description: "Runner for GitHub release asset publication."
        required: false
        type: string
        default: ubuntu-latest
      homebrew-tap:
        description: "Homebrew tap name used for installed proof."
        required: false
        type: string
        default: e0da/internal
      homebrew-formula:
        description: "Formula name; also used as build-output-dir/bin/<formula> for smoke."
        required: true
        type: string
      publish-github-release:
        description: "Upload the packaged payload and checksum to the current tag release."
        required: false
        type: boolean
        default: false
      run-homebrew-proof:
        description: "Run brew fetch, install, and test against the configured tap/formula."
        required: false
        type: boolean
        default: true
      installed-smoke-command:
        description: "Optional extra command to run after brew test."
        required: false
        type: string
        default: ""
      release-repo:
        description: "Target repo (owner/name) for GitHub release asset publication; empty uses the calling repo."
        required: false
        type: string
        default: ""
      homebrew-formula-path:
        description: "Path (in release-repo) to the tap's Formula/<name>.rb; empty skips the automated url/version/sha256 bump. The file must already exist — this updates the release fields, it does not author a formula from scratch."
        required: false
        type: string
        default: ""
    secrets:
      HOMEBREW_GITHUB_API_TOKEN:
        required: false
      RELEASE_REPO_TOKEN:
        required: false

jobs:
  release-interface:
    name: Release Interface Proof
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        if: inputs.setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install Bun dependencies
        if: inputs.setup-bun && inputs.bun-install-command != ''
        shell: sh
        run: ${{ inputs.bun-install-command }}

      - name: Export release environment
        shell: sh
        env:
          RELEASE_ENV: ${{ inputs.release-env }}
        run: |
          set -eu
          [ -n "$RELEASE_ENV" ] || exit 0
          printf '%s\n' "$RELEASE_ENV" | while IFS= read -r line; do
            [ -n "$line" ] || continue
            key=${line%%=*}
            case "$line" in
              *=*) ;;
              *)
                echo "invalid release-env entry: $line" >&2
                exit 2
                ;;
            esac
            case "$key" in
              ""|[0-9]*|*[!ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_]*)
                echo "invalid release-env key: $key" >&2
                exit 2
                ;;
            esac
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done

      - name: Install Homebrew build packages
        shell: sh
        env:
          HOMEBREW_BUILD_PACKAGES: ${{ inputs.homebrew-build-packages }}
        run: |
          set -eu
          [ -n "$HOMEBREW_BUILD_PACKAGES" ] || exit 0
          if ! command -v brew >/dev/null 2>&1; then
            echo "homebrew-build-packages requires brew on the selected runner." >&2
            exit 1
          fi
          printf '%s\n' "$HOMEBREW_BUILD_PACKAGES" | while IFS= read -r package; do
            [ -n "$package" ] || continue
            brew install "$package"
          done

      - name: Run release metadata
        shell: sh
        env:
          RELEASE_INTERFACE: ${{ inputs.release-interface }}
        run: |
          set -eu
          [ -f "$RELEASE_INTERFACE" ] || {
            echo "release interface not found: $RELEASE_INTERFACE" >&2
            exit 1
          }
          sh "$RELEASE_INTERFACE" metadata | tee release-interface-metadata.json

      - name: Validate GitHub release publishing ref
        if: inputs.publish-github-release && github.ref_type != 'tag'
        shell: sh
        run: |
          set -eu
          echo "publish-github-release requires a tag ref; got ${GITHUB_REF_TYPE:-unknown}:${GITHUB_REF_NAME}" >&2
          exit 1

      - name: Run release tests
        shell: sh
        env:
          RELEASE_INTERFACE: ${{ inputs.release-interface }}
        run: |
          set -eu
          sh "$RELEASE_INTERFACE" test

      - name: Build release payload
        shell: sh
        env:
          RELEASE_INTERFACE: ${{ inputs.release-interface }}
          BUILD_OUTPUT_DIR: ${{ inputs.build-output-dir }}
        run: |
          set -eu
          case "$BUILD_OUTPUT_DIR" in
            ""|/|.|/*|*..*)
              echo "unsafe build-output-dir: ${BUILD_OUTPUT_DIR:-<empty>}" >&2
              exit 2
              ;;
          esac
          rm -rf "$BUILD_OUTPUT_DIR"
          sh "$RELEASE_INTERFACE" build "$BUILD_OUTPUT_DIR"

      - name: Smoke built payload
        shell: sh
        env:
          RELEASE_INTERFACE: ${{ inputs.release-interface }}
          BUILD_OUTPUT_DIR: ${{ inputs.build-output-dir }}
          HOMEBREW_FORMULA: ${{ inputs.homebrew-formula }}
          BUILT_BINARY_NAME: ${{ inputs.built-binary-name }}
        run: |
          set -eu
          SMOKE_BINARY_NAME="$HOMEBREW_FORMULA"
          if [ -n "$BUILT_BINARY_NAME" ]; then
            SMOKE_BINARY_NAME="$BUILT_BINARY_NAME"
          fi
          sh "$RELEASE_INTERFACE" smoke "$BUILD_OUTPUT_DIR/bin/$SMOKE_BINARY_NAME"

      - name: Package release payload
        id: package
        shell: sh
        env:
          BUILD_OUTPUT_DIR: ${{ inputs.build-output-dir }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          HOMEBREW_FORMULA: ${{ inputs.homebrew-formula }}
        run: |
          set -eu
          safe_ref=$(printf '%s' "$GITHUB_REF_NAME" | tr '/:@ ' '----')
          archive="${ARTIFACT_NAME}-${safe_ref}-${HOMEBREW_FORMULA}.tar.gz"
          tar -C "$BUILD_OUTPUT_DIR" -czf "$archive" .
          shasum -a 256 "$archive" > "$archive.sha256"
          {
            echo "archive=$archive"
            echo "checksum=$archive.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release-interface artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            release-interface-metadata.json
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release Assets
    needs: release-interface
    if: inputs.publish-github-release && github.ref_type == 'tag'
    runs-on: ${{ inputs.publish-runner }}
    permissions:
      contents: write

    steps:
      - name: Download release-interface artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}

      - name: Validate cross-repo release token
        if: inputs.release-repo != '' && inputs.release-repo != github.repository
        shell: sh
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -eu
          if [ -z "$RELEASE_REPO_TOKEN" ]; then
            echo "RELEASE_REPO_TOKEN secret is required when release-repo differs from the calling repo." >&2
            exit 1
          fi

      - name: Publish GitHub release assets
        shell: sh
        env:
          GH_TOKEN: ${{ (inputs.release-repo != '' && inputs.release-repo != github.repository) && secrets.RELEASE_REPO_TOKEN || github.token }}
          GH_REPO: ${{ inputs.release-repo != '' && inputs.release-repo || github.repository }}
        run: |
          set -eu
          set -- *.tar.gz
          [ -f "$1" ] || {
            echo "release artifact tarball not found" >&2
            exit 1
          }
          archive="$1"
          checksum="$archive.sha256"
          [ -f "$checksum" ] || {
            echo "release artifact checksum not found: $checksum" >&2
            exit 1
          }

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber
            exit 0
          fi

          # `--generate-notes` summarizes GH_REPO's own commits. When
          # release-repo differs from the source repo (e0da/actions#110),
          # that's the tap's commits, not the artifact's — so cross-repo
          # notes name the source explicitly instead (E0D-1613).
          if [ "$GH_REPO" = "$GITHUB_REPOSITORY" ]; then
            set -- --generate-notes
          else
            set -- --notes "Built from \`$GITHUB_REPOSITORY@$GITHUB_SHA\` at tag \`$GITHUB_REF_NAME\`."
          fi
          case "$GITHUB_REF_NAME" in
            *-*) set -- "$@" --prerelease --latest=false ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" "$@"

          # Detector: a cross-repo release whose notes don't name the source
          # repo/commit should fail the job, not publish silently-wrong notes.
          if [ "$GH_REPO" != "$GITHUB_REPOSITORY" ]; then
            body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
            case "$body" in
              *"$GITHUB_REPOSITORY@$GITHUB_SHA"*) ;;
              *)
                echo "published release notes do not name the source repo/commit ($GITHUB_REPOSITORY@$GITHUB_SHA)" >&2
                exit 1
                ;;
            esac
          fi

      - name: Bump Homebrew formula
        if: inputs.homebrew-formula-path != ''
        shell: sh
        env:
          GH_TOKEN: ${{ (inputs.release-repo != '' && inputs.release-repo != github.repository) && secrets.RELEASE_REPO_TOKEN || github.token }}
          GH_REPO: ${{ inputs.release-repo != '' && inputs.release-repo || github.repository }}
          FORMULA_PATH: ${{ inputs.homebrew-formula-path }}
        run: |
          set -eu
          set -- *.tar.gz
          archive="$1"
          sha256=$(awk '{print $1}' "$archive.sha256")
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/$archive"

          # Bumps the three release-volatile fields of an already-authored
          # formula (desc/homepage/test/depends_on stay human-owned); this is
          # the missing half of Gate 3 (E0D-1610) — without it, "Homebrew
          # Installed Proof" races a formula a human hasn't updated yet.
          existing=$(gh api "repos/$GH_REPO/contents/$FORMULA_PATH") || {
            echo "bump Homebrew formula: $FORMULA_PATH not found in $GH_REPO — author it once by hand first" >&2
            exit 1
          }
          sha=$(printf '%s' "$existing" | jq -r '.sha')
          content=$(printf '%s' "$existing" | jq -r '.content' | base64 -d)
          updated=$(printf '%s\n' "$content" \
            | sed -E "s#^(  url \").*(\")\$#\\1${url}\\2#" \
            | sed -E "s#^(  version \").*(\")\$#\\1${version}\\2#" \
            | sed -E "s#^(  sha256 \").*(\")\$#\\1${sha256}\\2#")

          # Each sed is checked independently, not just "updated != content" —
          # one pattern failing to match (reordered/reformatted field) while
          # the others hit would still change the file and pass a coarser
          # diff check, leaving one field silently stale (E0D-1614).
          printf '%s\n' "$updated" | grep -qF "  url \"${url}\"" || {
            echo "bump Homebrew formula: url line not updated in $FORMULA_PATH" >&2
            exit 1
          }
          printf '%s\n' "$updated" | grep -qF "  version \"${version}\"" || {
            echo "bump Homebrew formula: version line not updated in $FORMULA_PATH" >&2
            exit 1
          }
          printf '%s\n' "$updated" | grep -qF "  sha256 \"${sha256}\"" || {
            echo "bump Homebrew formula: sha256 line not updated in $FORMULA_PATH" >&2
            exit 1
          }

          content_b64=$(printf '%s\n' "$updated" | base64 | tr -d '\n')
          gh api -X PUT "repos/$GH_REPO/contents/$FORMULA_PATH" \
            -f message="${GITHUB_REF_NAME}: bump url/version/sha256" \
            -f content="$content_b64" \
            -f sha="$sha"

  homebrew-proof:
    name: Homebrew Installed Proof
    needs: [release-interface, publish-github-release]
    if: inputs.run-homebrew-proof && (needs.publish-github-release.result == 'success' || needs.publish-github-release.result == 'skipped')
    runs-on: ${{ inputs.install-runner }}
    permissions:
      contents: read

    env:
      CALLER_HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN || github.token }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ secrets.HOMEBREW_GITHUB_API_TOKEN || github.token }}@github.com/.insteadOf"
      GIT_CONFIG_VALUE_0: "https://github.com/"
      HOMEBREW_TAP: ${{ inputs.homebrew-tap }}
      HOMEBREW_FORMULA: ${{ inputs.homebrew-formula }}
      INSTALLED_SMOKE_COMMAND: ${{ inputs.installed-smoke-command }}

    steps:
      - name: Validate private tap token
        shell: sh
        run: |
          set -eu
          if [ "$HOMEBREW_TAP" = "e0da/internal" ] && [ -z "$CALLER_HOMEBREW_GITHUB_API_TOKEN" ]; then
            echo "HOMEBREW_GITHUB_API_TOKEN secret is required for e0da/internal Homebrew proof." >&2
            exit 1
          fi

      - name: Tap and fetch formula
        shell: sh
        run: |
          set -eu
          brew tap "$HOMEBREW_TAP"
          brew fetch --force "$HOMEBREW_TAP/$HOMEBREW_FORMULA"

      - name: Install formula
        shell: sh
        run: |
          set -eu
          brew uninstall --force "$HOMEBREW_TAP/$HOMEBREW_FORMULA" >/dev/null 2>&1 || true
          brew install "$HOMEBREW_TAP/$HOMEBREW_FORMULA"

      - name: Test formula
        shell: sh
        run: |
          set -eu
          brew test "$HOMEBREW_TAP/$HOMEBREW_FORMULA"

      - name: Run installed smoke command
        if: inputs.installed-smoke-command != ''
        shell: sh
        run: |
          set -eu
          # Echo the command before running it. `test "$(foo)" = "$BAR"` is the
          # natural shape for this input and `test` is silent, so a failure
          # otherwise produces a red step with an empty log and the reader has
          # to open the calling repo's workflow to learn what was asserted.
          # Every other gate in this workflow names its own defect; this one
          # could not (E0D-1617).
          printf 'installed smoke command: %s\n' "$INSTALLED_SMOKE_COMMAND"
          sh -c "$INSTALLED_SMOKE_COMMAND" || {
            echo "installed smoke command failed: $INSTALLED_SMOKE_COMMAND" >&2
            exit 1
          }
