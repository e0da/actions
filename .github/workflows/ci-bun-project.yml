name: Bun project capability

on:
  workflow_call:
    inputs:
      runner:
        description: "Existing Linux ARM64 runner label admitted for the calling repository."
        required: true
        type: string
      project-directory:
        description: "Relative package directory in the calling repository."
        required: false
        type: string
        default: "."
      ci-command:
        description: "Trusted caller command after frozen dependency installation."
        required: false
        type: string
        default: "bun run verify"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Verify caller source in pinned browser environment
        env:
          PROJECT_DIRECTORY: ${{ inputs.project-directory }}
          CI_COMMAND: ${{ inputs.ci-command }}
          QUALIFICATION_IMAGE: mcr.microsoft.com/playwright@sha256:969a9e3655576186a7f3b3d85502f8c4041f4afce571df7aadba6384d93ee61f
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(bun --version)" = 1.4.4
          case "$PROJECT_DIRECTORY" in
            ""|/*|..|../*|*/../*|*/..) echo "project-directory must stay relative to source" >&2; exit 1 ;;
          esac
          test -f "$PROJECT_DIRECTORY/package.json"
          git rev-parse HEAD 'HEAD^{tree}'
          git archive --format=tar --output "$RUNNER_TEMP/bun-project-source.tar" HEAD
          docker pull "$QUALIFICATION_IMAGE"
          docker image inspect "$QUALIFICATION_IMAGE" \
            --format '{"id":{{json .Id}},"architecture":{{json .Architecture}},"os":{{json .Os}},"repo_digests":{{json .RepoDigests}}}' \
            > "$RUNNER_TEMP/bun-project-image.json"
          container_id=$(docker create \
            --env PROJECT_DIRECTORY --env CI_COMMAND --env CI=true \
            "$QUALIFICATION_IMAGE" /bin/bash -lc \
            'set -euo pipefail; mkdir /tmp/ci-project; tar -xf /tmp/project.tar -C /tmp/ci-project; cd "/tmp/ci-project/$PROJECT_DIRECTORY"; test "$(bun --version)" = 1.4.4; bun install --frozen-lockfile; test "$(bun x --no-install playwright --version)" = "Version 1.64.1"; bash -lc "$CI_COMMAND"')
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          docker cp "$RUNNER_TEMP/bun-project-source.tar" "$container_id:/tmp/project.tar"
          docker cp -L "$(command -v bun)" "$container_id:/usr/local/bin/bun"
          attach_status=0
          docker start --attach "$container_id" || attach_status=$?
          container_state=$(docker inspect --format '{{.State.Status}}' "$container_id")
          container_exit=$(docker inspect --format '{{.State.ExitCode}}' "$container_id")
          test "$container_state" = exited
          test "$attach_status" -eq 0
          exit "$container_exit"
      - name: Preserve observed image identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-project-image
          path: ${{ runner.temp }}/bun-project-image.json
          if-no-files-found: warn
          retention-days: 7
