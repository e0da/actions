name: PR Quality

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-quality:
    name: PR Quality
    uses: ./.github/workflows/pr-quality.yml
    with:
      runner: actions-linux-arm64
