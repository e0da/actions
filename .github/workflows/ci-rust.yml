name: CI Rust

# Reusable Rust CI workflow.
#
# Inputs:
#   toolchain           — Rust toolchain channel (default "stable").
#   features            — Cargo feature flags forwarded to clippy and test.
#   test-args           — Extra args appended to `cargo nextest run`.
#   system-deps         — Space-separated list of apt packages to install on the
#                         Ubuntu runner BEFORE Rust setup (e.g. "libpq-dev",
#                         "build-essential"). Empty default means no apt installs
#                         run. NOTE: sops is NOT in Ubuntu apt — use install-sops
#                         for sops.
#   install-sops        — When true, installs sops from official getsops/sops
#                         GitHub releases at the version pinned in this workflow.
#                         sops is the agency's first-class secrets envelope (per
#                         rules/secrets.md sops-first default), so it's a typed
#                         boolean input rather than a free-form package name.
#                         Default: false. Used by mm (and future agency Rust
#                         binaries that shell out to sops, e.g. mm-reply-shim per
#                         ADR-0026 §8).
#   install-nats-server — When true, installs nats-server from official
#                         nats-io/nats-server GitHub releases at the version
#                         pinned in this workflow. Required for integration tests
#                         that spawn a real nats-server process (e.g. mm's
#                         journey_a_standard_delivery_integration test harness in
#                         tests/common/mod.rs). ubuntu-latest does not include
#                         nats-server in its default package set.
#                         Default: false.
#   start-nats-jetstream — When true, installs nats-server if needed, starts a
#                         local JetStream-enabled nats-server on port 4222, and
#                         waits for it before running cargo checks. Use with
#                         nats-test-url for test suites that connect to NATS.
#                         Default: false.
#   nats-test-url       — Value exposed as NATS_TEST_URL for cargo commands.
#                         Default: "".

on:
  workflow_call:
    inputs:
      toolchain:
        required: false
        type: string
        default: stable
      features:
        required: false
        type: string
        default: ""
      test-args:
        required: false
        type: string
        default: ""
      system-deps:
        required: false
        type: string
        default: ""
      install-sops:
        required: false
        type: boolean
        default: false
      install-nats-server:
        required: false
        type: boolean
        default: false
      start-nats-jetstream:
        required: false
        type: boolean
        default: false
      nats-test-url:
        required: false
        type: string
        default: ""

jobs:
  build-and-test:
    name: Fmt / Clippy / Test / Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      NATS_TEST_URL: ${{ inputs.nats-test-url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        if: inputs.system-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - name: Install sops
        if: inputs.install-sops
        # Pinned version. Update this line to bump the agency's CI sops version.
        # Verify sha256 against the official release attestation before bumping.
        env:
          SOPS_VERSION: v3.12.2
          SOPS_SHA256: 14e2e1ba3bef31e74b70cf0b674f6443c80f6c5f3df15d05ffc57c34851b4998
        run: |
          set -euo pipefail
          url="https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          curl --fail --silent --show-error --location --output /tmp/sops "$url"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum --check --status
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version --disable-version-check

      - name: Install nats-server
        if: inputs.install-nats-server || inputs.start-nats-jetstream
        # Pinned version. Update this line to bump the agency's CI nats-server version.
        # Verify sha256 against the official SHA256SUMS file before bumping.
        env:
          NATS_VERSION: v2.14.0
          NATS_SHA256: 3d8b74dfad39af184c765a6dd120441ed1c648d6672eddf6b304f222661251b8
        run: |
          set -euo pipefail
          archive="nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          url="https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "/tmp/${archive}" "$url"
          echo "${NATS_SHA256}  /tmp/${archive}" | sha256sum --check --status
          tar -xzf "/tmp/${archive}" -C /tmp "nats-server-${NATS_VERSION}-linux-amd64/nats-server"
          sudo install -m 0755 "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version

      - name: Start nats-server with JetStream
        if: inputs.start-nats-jetstream
        run: |
          set -euo pipefail
          nohup nats-server -js -p 4222 > /tmp/nats-server.log 2>&1 &
          echo "$!" > /tmp/nats-server.pid
          for _ in {1..30}; do
            if timeout 1 bash -c ': > /dev/tcp/127.0.0.1/4222'; then
              exit 0
            fi
            sleep 1
          done
          tail -100 /tmp/nats-server.log
          exit 1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ inputs.toolchain }} \
            --profile minimal \
            --component clippy,rustfmt
          rustup default ${{ inputs.toolchain }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ inputs.toolchain }}-${{ runner.os }}

      - name: Install cargo-nextest from prebuilt binaries
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: none

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked \
            ${{ inputs.features != '' && format('--features {0}', inputs.features) || '' }} \
            -- -D warnings

      - name: Test
        run: |
          cargo nextest run --workspace --locked \
            ${{ inputs.features != '' && format('--features {0}', inputs.features) || '' }} \
            ${{ inputs.test-args != '' && inputs.test-args || '' }}

      - name: Build
        run: cargo build --workspace --locked
