name: CI Rust

# Reusable Rust CI workflow.
#
# Inputs:
#   toolchain           — Rust toolchain channel (default "stable").
#   features            — Cargo feature flags forwarded to clippy and test.
#   test-args           — Extra args appended to `cargo nextest run`.
#   system-deps         — Space-separated list of apt packages to install on the
#                         Ubuntu runner BEFORE Rust setup (e.g. "libpq-dev",
#                         "build-essential"). Empty default means no apt installs
#                         run. NOTE: sops is NOT in Ubuntu apt — use install-sops
#                         for sops.
#   install-sops        — When true, installs sops from official getsops/sops
#                         GitHub releases at the version pinned in this workflow.
#                         sops is the agency's first-class secrets envelope (per
#                         rules/secrets.md sops-first default), so it's a typed
#                         boolean input rather than a free-form package name.
#                         Default: false. Used by mm (and future agency Rust
#                         binaries that shell out to sops, e.g. mm-reply-shim per
#                         ADR-0026 §8).
#   install-nats-server — When true, installs nats-server from official
#                         nats-io/nats-server GitHub releases at the version
#                         pinned in this workflow. Required for integration tests
#                         that spawn a real nats-server process (e.g. mm's
#                         journey_a_standard_delivery_integration test harness in
#                         tests/common/mod.rs). ubuntu-latest does not include
#                         nats-server in its default package set.
#                         Default: false.
#   start-nats-jetstream — When true, starts a pinned local Docker NATS service
#                         with JetStream enabled on port 4222 and waits for it
#                         before running cargo checks. Use with nats-test-url
#                         for test suites that connect to NATS.
#                         Default: false.
#   nats-test-url       — Value exposed as NATS_TEST_URL for cargo commands.
#                         Default: "".
#   runner              — GitHub runner label for the Rust job.
#                         Default: "ubuntu-latest".

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest
      toolchain:
        required: false
        type: string
        default: stable
      features:
        required: false
        type: string
        default: ""
      test-args:
        required: false
        type: string
        default: ""
      system-deps:
        required: false
        type: string
        default: ""
      install-sops:
        required: false
        type: boolean
        default: false
      install-nats-server:
        required: false
        type: boolean
        default: false
      start-nats-jetstream:
        required: false
        type: boolean
        default: false
      nats-test-url:
        required: false
        type: string
        default: ""

jobs:
  build-and-test:
    name: Fmt / Clippy / Test / Build
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      NATS_TEST_URL: ${{ inputs.nats-test-url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies
        if: inputs.system-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - name: Install sops
        if: inputs.install-sops
        # Pinned version. Update this line to bump the agency's CI sops version.
        # Verify sha256 against the official release attestation before bumping.
        env:
          SOPS_VERSION: v3.12.2
          RUNNER_ARCH: ${{ runner.arch }}
          SOPS_LINUX_AMD64_SHA256: 14e2e1ba3bef31e74b70cf0b674f6443c80f6c5f3df15d05ffc57c34851b4998
          SOPS_LINUX_ARM64_SHA256: f66de6f528dca946e910d74fa36a62a7714c11d0db16bd3c9bd8acf73b66704b
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64)
              sops_arch=amd64
              sops_sha256="$SOPS_LINUX_AMD64_SHA256"
              ;;
            ARM64)
              sops_arch=arm64
              sops_sha256="$SOPS_LINUX_ARM64_SHA256"
              ;;
            *)
              echo "unsupported Linux runner architecture for sops install: ${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          url="https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.${sops_arch}"
          curl --fail --silent --show-error --location --output /tmp/sops "$url"
          echo "${sops_sha256}  /tmp/sops" | sha256sum --check --status
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version --disable-version-check

      - name: Install nats-server
        if: inputs.install-nats-server
        # Pinned version. Update this line to bump the agency's CI nats-server version.
        # Verify sha256 against the official SHA256SUMS file before bumping.
        env:
          NATS_VERSION: v2.14.0
          RUNNER_ARCH: ${{ runner.arch }}
          NATS_LINUX_AMD64_SHA256: 3d8b74dfad39af184c765a6dd120441ed1c648d6672eddf6b304f222661251b8
          NATS_LINUX_ARM64_SHA256: ce7dc5f7d97b70dabc38b13157fed28d7d06227860676143c15c62c5c297996c
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64)
              nats_arch=amd64
              nats_sha256="$NATS_LINUX_AMD64_SHA256"
              ;;
            ARM64)
              nats_arch=arm64
              nats_sha256="$NATS_LINUX_ARM64_SHA256"
              ;;
            *)
              echo "unsupported Linux runner architecture for nats-server install: ${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          archive="nats-server-${NATS_VERSION}-linux-${nats_arch}.tar.gz"
          url="https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "/tmp/${archive}" "$url"
          echo "${nats_sha256}  /tmp/${archive}" | sha256sum --check --status
          tar -xzf "/tmp/${archive}" -C /tmp "nats-server-${NATS_VERSION}-linux-${nats_arch}/nats-server"
          sudo install -m 0755 "/tmp/nats-server-${NATS_VERSION}-linux-${nats_arch}/nats-server" /usr/local/bin/nats-server
          nats-server --version

      - name: Start nats-server with JetStream
        if: inputs.start-nats-jetstream
        run: |
          set -euo pipefail
          docker rm -f ci-nats >/dev/null 2>&1 || true
          docker run --detach --name ci-nats --publish 4222:4222 nats:2.14.0 -js
          for _ in {1..30}; do
            if timeout 1 bash -c ': > /dev/tcp/127.0.0.1/4222'; then
              exit 0
            fi
            sleep 1
          done
          docker logs ci-nats
          exit 1

      - name: Install rustup when missing
        shell: sh
        run: |
          set -eu
          if command -v rustup >/dev/null 2>&1; then
            rustup --version
            exit 0
          fi

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://sh.rustup.rs \
            --output "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install Rust toolchain
        shell: sh
        env:
          RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          set -eu

          rust_toolchain_ready() {
            rustup run "$RUST_TOOLCHAIN" rustc --version >/dev/null 2>&1 || return 1
            rustup run "$RUST_TOOLCHAIN" cargo --version >/dev/null 2>&1 || return 1
            rustup run "$RUST_TOOLCHAIN" cargo clippy --version >/dev/null 2>&1 || return 1
            rustup run "$RUST_TOOLCHAIN" rustfmt --version >/dev/null 2>&1 || return 1
          }

          install_rust_toolchain() {
            rustup toolchain install "$RUST_TOOLCHAIN" \
              --profile minimal \
              --component clippy,rustfmt
          }

          if rust_toolchain_ready; then
            printf '%s\n' "Using preinstalled Rust toolchain: $RUST_TOOLCHAIN"
            rustup default "$RUST_TOOLCHAIN"
            exit 0
          fi

          attempt=1
          while [ "$attempt" -le 3 ]; do
            if install_rust_toolchain; then
              rustup default "$RUST_TOOLCHAIN"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              printf '%s\n' "rustup install failed after ${attempt} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 15))
            printf '%s\n' "rustup install attempt ${attempt} failed; retrying in ${sleep_seconds}s" >&2
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ inputs.toolchain }}-${{ runner.os }}
          cache-bin: "false"

      - name: Install cargo-nextest from prebuilt binaries
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: none

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked \
            ${{ inputs.features != '' && format('--features {0}', inputs.features) || '' }} \
            -- -D warnings

      - name: Test
        run: |
          cargo nextest run --workspace --locked \
            ${{ inputs.features != '' && format('--features {0}', inputs.features) || '' }} \
            ${{ inputs.test-args != '' && inputs.test-args || '' }}

      - name: Build
        run: cargo build --workspace --locked
