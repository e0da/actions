name: CI Markdown

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for markdown jobs."
        required: false
        type: string
        default: ubuntu-latest
      runner-profile:
        description: "Optional runner profile metadata for future validation; does not affect scheduling."
        required: false
        type: string
        default: ""
      runner-capabilities:
        description: "Optional requested runner capability metadata for future validation."
        required: false
        type: string
        default: ""
      runner-manifest:
        description: "Optional puck-linux-runner-image-contract.v1 JSON used to validate requested runner capabilities."
        required: false
        type: string
        default: ""
      tool-mode:
        description: "Tool setup mode for markdown link checking."
        required: false
        type: string
        default: workflow-install
      link-args:
        description: "Arguments passed to lychee."
        required: false
        type: string
        default: >-
          --verbose
          --no-progress
          --exclude-loopback
          --exclude-private
          --exclude "^mailto:"
          --exclude "^https://github.com/e0da/"
          '**/*.md'
jobs:
  link-check:
    name: Broken Link Check
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Add runner-local tools to PATH
        run: |
          set -eu

          if [ -d "$HOME/.local/bin" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Validate runner contract
        env:
          RUNNER_PROFILE: ${{ inputs['runner-profile'] }}
          RUNNER_CAPABILITIES: ${{ inputs['runner-capabilities'] }}
          RUNNER_MANIFEST: ${{ inputs['runner-manifest'] }}
          TOOL_MODE: ${{ inputs['tool-mode'] }}
          OBSERVED_RUNNER_OS: ${{ runner.os }}
          OBSERVED_RUNNER_ARCH: ${{ runner.arch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu

          case "$TOOL_MODE" in
            workflow-install|runner-preinstalled) ;;
            *)
              echo "::error::Unknown tool-mode '${TOOL_MODE}'. Expected one of: workflow-install, runner-preinstalled."
              exit 1
              ;;
          esac

          case "$RUNNER_PROFILE" in
            ""|hosted-linux|puck-linux-arm64|puck-macos-arm64) ;;
            *)
              echo "::error::Unknown runner-profile '${RUNNER_PROFILE}'. Expected one of: hosted-linux, puck-linux-arm64, puck-macos-arm64."
              exit 1
              ;;
          esac

          require_runner() {
            expected_os="$1"
            expected_arch="${2:-}"

            if [ "$OBSERVED_RUNNER_OS" != "$expected_os" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.os '${expected_os}', got '${OBSERVED_RUNNER_OS}'."
              exit 1
            fi

            if [ -n "$expected_arch" ] && [ "$OBSERVED_RUNNER_ARCH" != "$expected_arch" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.arch '${expected_arch}', got '${OBSERVED_RUNNER_ARCH}'."
              exit 1
            fi
          }

          case "$RUNNER_PROFILE" in
            hosted-linux) require_runner Linux ;;
            puck-linux-arm64) require_runner Linux ARM64 ;;
            puck-macos-arm64) require_runner macOS ARM64 ;;
          esac

          validate_runner_manifest() {
            [ -n "$RUNNER_MANIFEST" ] || return 0

            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::runner-manifest was provided, but jq was not found."
              exit 1
            fi

            schema="$(printf '%s' "$RUNNER_MANIFEST" | jq -r '.schema_version // ""')"
            if [ "$schema" != "puck-linux-runner-image-contract.v1" ]; then
              echo "::error::runner-manifest schema_version must be puck-linux-runner-image-contract.v1, got '${schema:-<missing>}'."
              exit 1
            fi

            repo="${REPOSITORY#*/}"
            runner_entry="$(printf '%s' "$RUNNER_MANIFEST" | jq -c --arg repo "$repo" '.runners[]? | select(.runner_identity.repo == $repo)' | sed -n '1p')"
            if [ -z "$runner_entry" ]; then
              echo "::error::runner-manifest missing runners[].runner_identity.repo entry for '${repo}'."
              exit 1
            fi

            manifest_profile="$(printf '%s' "$runner_entry" | jq -r '.runner_identity.runner_profile // ""')"
            if [ -n "$RUNNER_PROFILE" ] && [ "$manifest_profile" != "$RUNNER_PROFILE" ]; then
              echo "::error::runner-manifest runner_identity.runner_profile expected '${RUNNER_PROFILE}', got '${manifest_profile:-<missing>}'."
              exit 1
            fi

            manifest_os="$(printf '%s' "$runner_entry" | jq -r '.intended_contract_state.runner_os // ""')"
            if [ -n "$manifest_os" ] && [ "$manifest_os" != "$OBSERVED_RUNNER_OS" ]; then
              echo "::error::runner-manifest intended_contract_state.runner_os expected '${OBSERVED_RUNNER_OS}', got '${manifest_os}'."
              exit 1
            fi

            manifest_arch="$(printf '%s' "$runner_entry" | jq -r '.intended_contract_state.runner_arch // ""')"
            if [ -n "$manifest_arch" ] && [ "$manifest_arch" != "$OBSERVED_RUNNER_ARCH" ]; then
              echo "::error::runner-manifest intended_contract_state.runner_arch expected '${OBSERVED_RUNNER_ARCH}', got '${manifest_arch}'."
              exit 1
            fi

            manifest_capabilities="$RUNNER_CAPABILITIES"
            if [ "$TOOL_MODE" = runner-preinstalled ]; then
              manifest_capabilities="${manifest_capabilities}${manifest_capabilities:+ }lychee"
            fi

            for capability in $manifest_capabilities; do
              tool_status="$(printf '%s' "$runner_entry" | jq -r --arg name "$capability" '([.tools[]? | select(.name == $name)] | first | .observed.status) // "missing-tool-entry"')"
              if [ "$tool_status" != "present" ]; then
                echo "::error::runner-manifest tools.${capability}.observed.status expected 'present', got '${tool_status}'."
                exit 1
              fi

              tool_version="$(printf '%s' "$runner_entry" | jq -r --arg name "$capability" '([.tools[]? | select(.name == $name)] | first | .observed.version) // ""')"
              if [ -z "$tool_version" ]; then
                echo "::error::runner-manifest tools.${capability}.observed.version expected a non-empty version."
                exit 1
              fi
            done
          }

          for capability in $RUNNER_CAPABILITIES; do
            case "$capability" in
              gh|ruby|brew|make|lychee)
                if ! command -v "$capability" >/dev/null 2>&1; then
                  echo "::error::runner-capabilities requested '${capability}', but command '${capability}' was not found."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Unknown runner-capabilities token '${capability}'. Expected one of: gh, ruby, brew, make, lychee."
                exit 1
                ;;
            esac
          done

          if [ "$TOOL_MODE" = runner-preinstalled ] && ! command -v lychee >/dev/null 2>&1; then
            echo "::error::tool-mode runner-preinstalled requires lychee on PATH."
            exit 1
          fi

          validate_runner_manifest

          echo "Runner contract OK: profile='${RUNNER_PROFILE:-<none>}' capabilities='${RUNNER_CAPABILITIES:-<none>}' tool-mode='${TOOL_MODE}' os='${OBSERVED_RUNNER_OS}' arch='${OBSERVED_RUNNER_ARCH}'."

      - uses: actions/checkout@v5

      - name: Check links
        if: runner.os == 'Linux' && inputs['tool-mode'] == 'workflow-install'
        uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ inputs['link-args'] }}
          failIfEmpty: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check links with preinstalled lychee
        if: runner.os == 'Linux' && inputs['tool-mode'] == 'runner-preinstalled'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LYCHEE_ARGS: ${{ inputs['link-args'] }}
        run: bash -lc "lychee ${LYCHEE_ARGS}"

      - name: Install lychee
        if: runner.os == 'macOS' && inputs['tool-mode'] == 'workflow-install'
        run: |
          if command -v lychee >/dev/null 2>&1; then
            exit 0
          fi

          if ! command -v brew >/dev/null 2>&1; then
            echo "Homebrew is required to install lychee on macOS self-hosted runners."
            exit 1
          fi

          brew install lychee

      - name: Check links
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LYCHEE_ARGS: ${{ inputs['link-args'] }}
        run: bash -lc "lychee ${LYCHEE_ARGS}"

      - name: Check runner support
        if: runner.os != 'Linux' && runner.os != 'macOS'
        run: |
          echo "ci-markdown supports Linux and macOS runners."
          exit 1

  yaml-frontmatter:
    name: YAML Frontmatter Validation
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Add runner-local tools to PATH
        run: |
          set -eu

          if [ -d "$HOME/.local/bin" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Validate runner contract
        env:
          RUNNER_PROFILE: ${{ inputs['runner-profile'] }}
          RUNNER_CAPABILITIES: ${{ inputs['runner-capabilities'] }}
          RUNNER_MANIFEST: ${{ inputs['runner-manifest'] }}
          OBSERVED_RUNNER_OS: ${{ runner.os }}
          OBSERVED_RUNNER_ARCH: ${{ runner.arch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu

          case "$RUNNER_PROFILE" in
            ""|hosted-linux|puck-linux-arm64|puck-macos-arm64) ;;
            *)
              echo "::error::Unknown runner-profile '${RUNNER_PROFILE}'. Expected one of: hosted-linux, puck-linux-arm64, puck-macos-arm64."
              exit 1
              ;;
          esac

          require_runner() {
            expected_os="$1"
            expected_arch="${2:-}"

            if [ "$OBSERVED_RUNNER_OS" != "$expected_os" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.os '${expected_os}', got '${OBSERVED_RUNNER_OS}'."
              exit 1
            fi

            if [ -n "$expected_arch" ] && [ "$OBSERVED_RUNNER_ARCH" != "$expected_arch" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.arch '${expected_arch}', got '${OBSERVED_RUNNER_ARCH}'."
              exit 1
            fi
          }

          case "$RUNNER_PROFILE" in
            hosted-linux) require_runner Linux ;;
            puck-linux-arm64) require_runner Linux ARM64 ;;
            puck-macos-arm64) require_runner macOS ARM64 ;;
          esac

          validate_runner_manifest() {
            [ -n "$RUNNER_MANIFEST" ] || return 0

            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::runner-manifest was provided, but jq was not found."
              exit 1
            fi

            schema="$(printf '%s' "$RUNNER_MANIFEST" | jq -r '.schema_version // ""')"
            if [ "$schema" != "puck-linux-runner-image-contract.v1" ]; then
              echo "::error::runner-manifest schema_version must be puck-linux-runner-image-contract.v1, got '${schema:-<missing>}'."
              exit 1
            fi

            repo="${REPOSITORY#*/}"
            runner_entry="$(printf '%s' "$RUNNER_MANIFEST" | jq -c --arg repo "$repo" '.runners[]? | select(.runner_identity.repo == $repo)' | sed -n '1p')"
            if [ -z "$runner_entry" ]; then
              echo "::error::runner-manifest missing runners[].runner_identity.repo entry for '${repo}'."
              exit 1
            fi

            manifest_profile="$(printf '%s' "$runner_entry" | jq -r '.runner_identity.runner_profile // ""')"
            if [ -n "$RUNNER_PROFILE" ] && [ "$manifest_profile" != "$RUNNER_PROFILE" ]; then
              echo "::error::runner-manifest runner_identity.runner_profile expected '${RUNNER_PROFILE}', got '${manifest_profile:-<missing>}'."
              exit 1
            fi

            manifest_os="$(printf '%s' "$runner_entry" | jq -r '.intended_contract_state.runner_os // ""')"
            if [ -n "$manifest_os" ] && [ "$manifest_os" != "$OBSERVED_RUNNER_OS" ]; then
              echo "::error::runner-manifest intended_contract_state.runner_os expected '${OBSERVED_RUNNER_OS}', got '${manifest_os}'."
              exit 1
            fi

            manifest_arch="$(printf '%s' "$runner_entry" | jq -r '.intended_contract_state.runner_arch // ""')"
            if [ -n "$manifest_arch" ] && [ "$manifest_arch" != "$OBSERVED_RUNNER_ARCH" ]; then
              echo "::error::runner-manifest intended_contract_state.runner_arch expected '${OBSERVED_RUNNER_ARCH}', got '${manifest_arch}'."
              exit 1
            fi

            for capability in $RUNNER_CAPABILITIES; do
              tool_status="$(printf '%s' "$runner_entry" | jq -r --arg name "$capability" '([.tools[]? | select(.name == $name)] | first | .observed.status) // "missing-tool-entry"')"
              if [ "$tool_status" != "present" ]; then
                echo "::error::runner-manifest tools.${capability}.observed.status expected 'present', got '${tool_status}'."
                exit 1
              fi

              tool_version="$(printf '%s' "$runner_entry" | jq -r --arg name "$capability" '([.tools[]? | select(.name == $name)] | first | .observed.version) // ""')"
              if [ -z "$tool_version" ]; then
                echo "::error::runner-manifest tools.${capability}.observed.version expected a non-empty version."
                exit 1
              fi
            done
          }

          for capability in $RUNNER_CAPABILITIES; do
            case "$capability" in
              gh|ruby|brew|make|lychee)
                if ! command -v "$capability" >/dev/null 2>&1; then
                  echo "::error::runner-capabilities requested '${capability}', but command '${capability}' was not found."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Unknown runner-capabilities token '${capability}'. Expected one of: gh, ruby, brew, make, lychee."
                exit 1
                ;;
            esac
          done

          validate_runner_manifest

          echo "Runner contract OK: profile='${RUNNER_PROFILE:-<none>}' capabilities='${RUNNER_CAPABILITIES:-<none>}' os='${OBSERVED_RUNNER_OS}' arch='${OBSERVED_RUNNER_ARCH}'."

      - uses: actions/checkout@v5

      - name: Validate YAML frontmatter in .md files
        run: |
          ruby <<'RB'
          require "date"
          require "yaml"

          files = `git ls-files "*.md"`.split("\n")
          failed = false

          files.each do |path|
            content = File.read(path, encoding: "UTF-8")
            next unless content.start_with?("---\n")

            match = content.match(/\A---\R(.*?)\R---\R/m)
            unless match && !match[1].strip.empty?
              warn "ERROR #{path}: Unclosed or empty frontmatter block"
              failed = true
              next
            end

            begin
              YAML.safe_load(match[1], permitted_classes: [Date, Time], aliases: true)
            rescue Psych::Exception => error
              warn "ERROR #{path}: Invalid YAML frontmatter: #{error.message}"
              failed = true
            else
              puts "OK #{path}"
            end
          end

          exit(failed ? 1 : 0)
          RB
