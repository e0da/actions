name: CI Markdown

on:
  workflow_call:
    inputs:
      link-args:
        description: "Arguments passed to lychee."
        required: false
        type: string
        default: >-
          --verbose
          --no-progress
          --exclude-loopback
          --exclude-private
          --exclude "^mailto:"
          --exclude "^https://github.com/e0da/"
          '**/*.md'
      validate-frontmatter:
        description: "Whether to validate YAML frontmatter blocks in Markdown files."
        required: false
        type: boolean
        default: true

jobs:
  link-check:
    name: Broken Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ inputs.link-args }}
          failIfEmpty: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  yaml-frontmatter:
    name: YAML Frontmatter Validation
    if: ${{ inputs.validate-frontmatter }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Validate YAML frontmatter in .md files
        run: |
          python3 <<'PY'
          import subprocess
          import sys

          import yaml

          files = subprocess.run(
              ["rg", "--files", "-g", "*.md", "-g", "!**/.git/**"],
              check=False,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          ).stdout.splitlines()

          failed = False
          for path in files:
              with open(path, "r", encoding="utf-8") as handle:
                  content = handle.read()

              if not content.startswith("---\n"):
                  continue

              parts = content.split("---", 2)
              if len(parts) < 3 or not parts[1].strip():
                  print(f"❌ {path}: Unclosed or empty frontmatter block")
                  failed = True
                  continue

              try:
                  yaml.safe_load(parts[1])
              except yaml.YAMLError as error:
                  print(f"❌ {path}: Invalid YAML frontmatter: {error}")
                  failed = True
              else:
                  print(f"✅ {path}")

          sys.exit(1 if failed else 0)
          PY
