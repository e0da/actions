name: CI Baseline

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for baseline jobs."
        required: false
        type: string
        default: ubuntu-latest

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Resolve current PR title
        id: pr-title
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          title="$EVENT_PR_TITLE"
          if [[ -n "$PR_NUMBER" ]]; then
            current_title="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title' 2>/dev/null || true)"
            if [[ -n "$current_title" ]]; then
              title="$current_title"
            fi
          fi
          {
            echo 'title<<EOF'
            echo "$title"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check PR title format
        env:
          PR_TITLE: ${{ steps.pr-title.outputs.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|chore|docs|refactor|test|ci)(\(.+\))?:[[:space:]].+ ]]; then
            echo "❌ PR title must follow Conventional Commits format."
            echo "   Expected: feat|fix|chore|docs|refactor|test|ci: <description>"
            echo "   Got: $PR_TITLE"
            exit 1
          fi
          echo "✅ PR title OK: $PR_TITLE"

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
