name: CI Baseline

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for baseline jobs."
        required: false
        type: string
        default: ubuntu-latest

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Resolve current PR title
        id: pr-title
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          title="$EVENT_PR_TITLE"
          if [[ -n "$PR_NUMBER" ]]; then
            current_title="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title' 2>/dev/null || true)"
            if [[ -n "$current_title" ]]; then
              title="$current_title"
            fi
          fi
          {
            echo 'title<<EOF'
            echo "$title"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check PR title format
        env:
          PR_TITLE: ${{ steps.pr-title.outputs.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|chore|docs|refactor|test|ci)(\(.+\))?:[[:space:]].+ ]]; then
            echo "❌ PR title must follow Conventional Commits format."
            echo "   Expected: feat|fix|chore|docs|refactor|test|ci: <description>"
            echo "   Got: $PR_TITLE"
            exit 1
          fi
          echo "✅ PR title OK: $PR_TITLE"

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail

          case "${RUNNER_OS}_${RUNNER_ARCH}" in
            Linux_X64)
              asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
              sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
              ;;
            Linux_ARM64)
              asset="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
              sha256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
              ;;
            macOS_X64)
              asset="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz"
              sha256="dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709"
              ;;
            macOS_ARM64)
              asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
              sha256="b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
              ;;
            *)
              echo "unsupported runner for Gitleaks CLI install: ${RUNNER_OS}_${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac

          archive_path="${RUNNER_TEMP}/${asset}"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --silent --show-error --location \
            --output "$archive_path" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${sha256}  ${archive_path}" | shasum -a 256 --check
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir" gitleaks
          chmod +x "${install_dir}/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Secret scan
        continue-on-error: true
        run: gitleaks detect --source . --verbose --redact
