name: CI Baseline

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for baseline jobs."
        required: false
        type: string
        default: ubuntu-latest
      runner-profile:
        description: "Optional runner profile metadata for future validation; does not affect scheduling."
        required: false
        type: string
        default: ""
      runner-capabilities:
        description: "Optional requested runner capability metadata for future validation."
        required: false
        type: string
        default: ""

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate runner contract
        env:
          RUNNER_PROFILE: ${{ inputs['runner-profile'] }}
          RUNNER_CAPABILITIES: ${{ inputs['runner-capabilities'] }}
          OBSERVED_RUNNER_OS: ${{ runner.os }}
          OBSERVED_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -eu

          case "$RUNNER_PROFILE" in
            ""|hosted-linux|e0da-puck-linux-arm64|puck-macos-arm64) ;;
            *)
              echo "::error::Unknown runner-profile '${RUNNER_PROFILE}'. Expected one of: hosted-linux, e0da-puck-linux-arm64, puck-macos-arm64."
              exit 1
              ;;
          esac

          require_runner() {
            expected_os="$1"
            expected_arch="${2:-}"

            if [ "$OBSERVED_RUNNER_OS" != "$expected_os" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.os '${expected_os}', got '${OBSERVED_RUNNER_OS}'."
              exit 1
            fi

            if [ -n "$expected_arch" ] && [ "$OBSERVED_RUNNER_ARCH" != "$expected_arch" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.arch '${expected_arch}', got '${OBSERVED_RUNNER_ARCH}'."
              exit 1
            fi
          }

          case "$RUNNER_PROFILE" in
            hosted-linux) require_runner Linux ;;
            e0da-puck-linux-arm64) require_runner Linux ARM64 ;;
            puck-macos-arm64) require_runner macOS ARM64 ;;
          esac

          for capability in $RUNNER_CAPABILITIES; do
            case "$capability" in
              gh|ruby|brew|make)
                if ! command -v "$capability" >/dev/null 2>&1; then
                  echo "::error::runner-capabilities requested '${capability}', but command '${capability}' was not found."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Unknown runner-capabilities token '${capability}'. Expected one of: gh, ruby, brew, make."
                exit 1
                ;;
            esac
          done

          echo "Runner contract OK: profile='${RUNNER_PROFILE:-<none>}' capabilities='${RUNNER_CAPABILITIES:-<none>}' os='${OBSERVED_RUNNER_OS}' arch='${OBSERVED_RUNNER_ARCH}'."

      - name: Resolve current PR title
        id: pr-title
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          title="$EVENT_PR_TITLE"
          if [[ -n "$PR_NUMBER" ]]; then
            current_title="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title' 2>/dev/null || true)"
            if [[ -n "$current_title" ]]; then
              title="$current_title"
            fi
          fi
          {
            echo 'title<<EOF'
            echo "$title"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check PR title format
        env:
          PR_TITLE: ${{ steps.pr-title.outputs.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|chore|docs|refactor|test|ci)(\(.+\))?:[[:space:]].+ ]]; then
            echo "❌ PR title must follow Conventional Commits format."
            echo "   Expected: feat|fix|chore|docs|refactor|test|ci: <description>"
            echo "   Got: $PR_TITLE"
            exit 1
          fi
          echo "✅ PR title OK: $PR_TITLE"

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Validate runner contract
        env:
          RUNNER_PROFILE: ${{ inputs['runner-profile'] }}
          RUNNER_CAPABILITIES: ${{ inputs['runner-capabilities'] }}
          OBSERVED_RUNNER_OS: ${{ runner.os }}
          OBSERVED_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -eu

          case "$RUNNER_PROFILE" in
            ""|hosted-linux|e0da-puck-linux-arm64|puck-macos-arm64) ;;
            *)
              echo "::error::Unknown runner-profile '${RUNNER_PROFILE}'. Expected one of: hosted-linux, e0da-puck-linux-arm64, puck-macos-arm64."
              exit 1
              ;;
          esac

          require_runner() {
            expected_os="$1"
            expected_arch="${2:-}"

            if [ "$OBSERVED_RUNNER_OS" != "$expected_os" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.os '${expected_os}', got '${OBSERVED_RUNNER_OS}'."
              exit 1
            fi

            if [ -n "$expected_arch" ] && [ "$OBSERVED_RUNNER_ARCH" != "$expected_arch" ]; then
              echo "::error::runner-profile '${RUNNER_PROFILE}' requires runner.arch '${expected_arch}', got '${OBSERVED_RUNNER_ARCH}'."
              exit 1
            fi
          }

          case "$RUNNER_PROFILE" in
            hosted-linux) require_runner Linux ;;
            e0da-puck-linux-arm64) require_runner Linux ARM64 ;;
            puck-macos-arm64) require_runner macOS ARM64 ;;
          esac

          for capability in $RUNNER_CAPABILITIES; do
            case "$capability" in
              gh|ruby|brew|make)
                if ! command -v "$capability" >/dev/null 2>&1; then
                  echo "::error::runner-capabilities requested '${capability}', but command '${capability}' was not found."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Unknown runner-capabilities token '${capability}'. Expected one of: gh, ruby, brew, make."
                exit 1
                ;;
            esac
          done

          echo "Runner contract OK: profile='${RUNNER_PROFILE:-<none>}' capabilities='${RUNNER_CAPABILITIES:-<none>}' os='${OBSERVED_RUNNER_OS}' arch='${OBSERVED_RUNNER_ARCH}'."

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail

          case "${RUNNER_OS}_${RUNNER_ARCH}" in
            Linux_X64)
              asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
              sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
              ;;
            Linux_ARM64)
              asset="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
              sha256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
              ;;
            macOS_X64)
              asset="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz"
              sha256="dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709"
              ;;
            macOS_ARM64)
              asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
              sha256="b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
              ;;
            *)
              echo "unsupported runner for Gitleaks CLI install: ${RUNNER_OS}_${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac

          archive_path="${RUNNER_TEMP}/${asset}"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --silent --show-error --location \
            --output "$archive_path" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${sha256}  ${archive_path}" | shasum -a 256 --check
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir" gitleaks
          chmod +x "${install_dir}/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Secret scan
        continue-on-error: true
        run: gitleaks detect --source . --verbose --redact
