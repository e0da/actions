name: PR Quality

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for the PR quality gate."
        required: false
        type: string
        default: puck-linux-arm64
      projection-label:
        description: "Ignored. Accepted so existing callers keep working."
        required: false
        type: string
        default: ""

jobs:
  pr-quality:
    name: PR Quality
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    concurrency:
      group: pr-quality-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event.pull_request.number != '' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Enforce PR quality contract
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu

          export NO_COLOR=1
          export CLICOLOR=0
          export CLICOLOR_FORCE=0

          fail() {
            echo "::error::$1"
            echo "$1" >&2
            exit 1
          }

          for command_name in gh jq; do
            command -v "$command_name" >/dev/null 2>&1 || fail "required command is unavailable: $command_name"
          done

          printf '%s\n' "$PULL_REQUEST_NUMBER" | grep -Eq '^[0-9]+$' ||
            fail "PR quality requires a pull request event"

          temp_root="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$temp_root"
          workdir="$(mktemp -d "${temp_root}/pr-quality.XXXXXX")"
          trap 'rm -rf "$workdir"' EXIT
          pr_json="$workdir/pr.json"
          pr_body_raw="$workdir/pr-body-raw.md"
          pr_body="$workdir/pr-body.md"

          gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" > "$pr_json"
          live_head="$(jq -r '.head.sha // ""' "$pr_json")"
          jq -r '.body // ""' "$pr_json" > "$pr_body_raw"

          printf '%s\n' "$live_head" | grep -Eq '^[0-9a-f]{40}$' || fail "live PR head is missing or malformed"
          [ -n "$(jq -r '.title // ""' "$pr_json")" ] || fail "PR title is missing"
          if grep -F 'PR_BODY_REQUIRED:' "$pr_body_raw" >/dev/null; then
            fail "replace every PR_BODY_REQUIRED:<SECTION> placeholder"
          fi

          visible_markdown() {
            awk '
              function leading_run(text, character, count) {
                count=0
                while (substr(text, count + 1, 1) == character) { count++ }
                return count
              }
              {
                raw=$0
                if (fence_length > 0) {
                  indentation=0
                  while (indentation < 4 && substr(raw, indentation + 1, 1) == " ") {
                    indentation++
                  }
                  fence_eligible=(indentation <= 3)
                  control=substr(raw, indentation + 1)
                  if (fence_eligible) {
                    run_length=leading_run(control, fence_character)
                    remainder=substr(control, run_length + 1)
                    if (run_length >= fence_length && remainder ~ /^[[:space:]]*$/) {
                      fence_character=""
                      fence_length=0
                    }
                  }
                  print ""
                  next
                }
                line=raw
                visible=""
                while (1) {
                  if (comment) {
                    ending=index(line, "-->")
                    if (!ending) {
                      line=""
                      break
                    }
                    line=substr(line, ending + 3)
                    comment=0
                  }
                  opening=index(line, "<!--")
                  if (!opening) {
                    visible=visible line
                    break
                  }
                  visible=visible substr(line, 1, opening - 1)
                  line=substr(line, opening + 4)
                  comment=1
                }
                indentation=0
                while (indentation < 4 && substr(visible, indentation + 1, 1) == " ") {
                  indentation++
                }
                fence_eligible=(indentation <= 3)
                control=substr(visible, indentation + 1)
                opening_character=substr(control, 1, 1)
                if (fence_eligible && (opening_character == "`" || opening_character == "~")) {
                  opening_length=leading_run(control, opening_character)
                  if (opening_length >= 3) {
                    fence_character=opening_character
                    fence_length=opening_length
                    print ""
                    next
                  }
                }
                print visible
              }
              END { exit(comment || fence_length > 0 ? 1 : 0) }
            ' "$1" > "$2"
          }

          visible_markdown "$pr_body_raw" "$pr_body" ||
            fail "PR body contains an unclosed HTML comment or code fence"

          has_nonempty_section() {
            section_name="$1"
            awk -v heading="## $section_name" '
              $0 == heading { seen=1; active=1; next }
              active && /^## / { active=0 }
              active {
                text=$0
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", text)
                if (text != "") { content=1 }
              }
              END { exit(seen && content ? 0 : 1) }
            ' "$pr_body"
          }

          for section_name in Outcome Verification 'Risk and rollback'; do
            has_nonempty_section "$section_name" ||
              fail "missing required non-empty section: $section_name"
          done

          approvals="$(
            {
              gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews" --paginate --jq '.[] | select(.state != "DISMISSED") | {commit_id, body}'
              gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/comments" --paginate --jq '.[] | {commit_id, body}'
            } | jq -r --arg head "$live_head" '
              select(.commit_id == $head and ((.body // "") | test("verdict:[[:space:]]*approve"; "i"))) | "1"
            ' | wc -l | tr -d ' '
          )"
          [ "$approvals" -ge 1 ] ||
            fail "no review or review comment on head ${live_head} says 'Verdict: Approve'"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## PR Quality"
              echo
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Pull request | #${PULL_REQUEST_NUMBER} |"
              echo "| Reviewed head | \`${live_head}\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "PR quality contract satisfied"
