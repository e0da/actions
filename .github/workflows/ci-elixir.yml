name: Reusable Elixir CI

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label for the Mix job."
        required: false
        type: string
        default: ubuntu-latest
      otp-version:
        description: "Erlang/OTP version passed to erlef/setup-beam."
        required: false
        type: string
        default: "28"
      elixir-version:
        description: "Elixir version passed to erlef/setup-beam."
        required: false
        type: string
        default: "1.19.5"
      deps-command:
        description: "Command that fetches project dependencies."
        required: false
        type: string
        default: "mix deps.get --only test"
      ci-command:
        description: "Command that runs the project CI contract."
        required: false
        type: string
        default: "mix ci"
      cache-mode:
        description: "Mix dependency cache policy. read-write preserves current behavior; off skips the cache step."
        required: false
        type: string
        default: read-write
      toolchain-cache-mode:
        description: "Downloaded BEAM tool cache: off (default) or read-write. No project build outputs are included."
        required: false
        type: string
        default: "off"
      toolchain-cache-salt:
        description: "Optional extra namespace; platform, exact versions and action revision always remain in the key."
        required: false
        type: string
        default: ""
      beam-mode:
        description: "BEAM setup policy. setup-beam preserves hosted behavior; runner-preinstalled uses erl/elixir/mix already on PATH."
        required: false
        type: string
        default: setup-beam
    secrets:
      private_deps_ssh_key:
        description: "Optional SSH private key for fetching private cross-repo git deps. When unset, the SSH-config step is skipped and behavior is unchanged."
        required: false

jobs:
  mix:
    name: Mix
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    env:
      MIX_ENV: test
      PRIVATE_DEPS_SSH_KEY: ${{ secrets.private_deps_ssh_key }}
    steps:
      - name: Validate policy modes
        env:
          CACHE_MODE: ${{ inputs.cache-mode }}
          TOOLCHAIN_CACHE_MODE: ${{ inputs.toolchain-cache-mode }}
          BEAM_MODE: ${{ inputs.beam-mode }}
        run: |
          set -eu

          case "$CACHE_MODE" in
            read-write|off)
              ;;
            *)
              echo "::error::Unknown cache-mode '${CACHE_MODE}'. Expected one of: read-write, off."
              exit 1
              ;;
          esac

          case "$TOOLCHAIN_CACHE_MODE" in
            read-write|off) ;;
            *) echo "::error::Unknown toolchain-cache-mode. Expected read-write or off."; exit 1 ;;
          esac

          case "$BEAM_MODE" in
            setup-beam|runner-preinstalled)
              ;;
            *)
              echo "::error::Unknown beam-mode '${BEAM_MODE}'. Expected one of: setup-beam, runner-preinstalled."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v5

      - name: Identify immutable toolchain cache
        id: beam-platform
        if: inputs.beam-mode == 'setup-beam' && inputs.toolchain-cache-mode == 'read-write'
        env:
          OTP_VERSION: ${{ inputs.otp-version }}
          ELIXIR_VERSION: ${{ inputs.elixir-version }}
        run: |
          set -eu
          printf '%s\n' "$OTP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' || {
            echo '::error::Toolchain caching requires an exact OTP version, not a range.'; exit 1;
          }
          printf '%s\n' "$ELIXIR_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo '::error::Toolchain caching requires an exact Elixir version, not a range.'; exit 1;
          }
          if [ -r /etc/os-release ]; then
            identity="$(sha256sum /etc/os-release | cut -d ' ' -f 1)"
          elif command -v sw_vers >/dev/null 2>&1; then
            identity="$(sw_vers | shasum -a 256 | cut -d ' ' -f 1)"
          else
            echo '::error::Unsupported toolchain cache platform fingerprint.'; exit 1
          fi
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      - name: Cache downloaded BEAM tools
        id: beam-download-cache
        if: inputs.beam-mode == 'setup-beam' && inputs.toolchain-cache-mode == 'read-write'
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.tool_cache }}/otp
            ${{ runner.tool_cache }}/elixir
          key: beam-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam-platform.outputs.identity }}-54075bcc5e249e4758d363f27d099f55d843f124-${{ inputs.otp-version }}-${{ inputs.elixir-version }}-${{ inputs.toolchain-cache-salt }}

      - name: Set up BEAM
        if: inputs.beam-mode == 'setup-beam'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-type: ${{ inputs.toolchain-cache-mode == 'read-write' && 'strict' || 'loose' }}
          otp-version: ${{ inputs.otp-version }}
          elixir-version: ${{ inputs.elixir-version }}

      - name: Verify preinstalled BEAM
        if: inputs.beam-mode == 'runner-preinstalled'
        run: |
          set -eu

          command -v erl
          command -v elixir
          command -v mix

          erl -version
          elixir --version
          mix --version

      - name: Cache Mix deps
        id: mix-cache
        if: inputs.cache-mode == 'read-write'
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ inputs.otp-version }}-elixir-${{ inputs.elixir-version }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ inputs.otp-version }}-elixir-${{ inputs.elixir-version }}-mix-
            ${{ runner.os }}-mix-

      - name: Report Elixir CI policy
        env:
          BEAM_MODE: ${{ inputs.beam-mode }}
          CACHE_EXACT_KEY_HIT: ${{ steps.mix-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ runner.os }}-otp-${{ inputs.otp-version }}-elixir-${{ inputs.elixir-version }}-mix-${{ hashFiles('mix.lock') }}
          CACHE_MODE: ${{ inputs.cache-mode }}
          CI_COMMAND: ${{ inputs.ci-command }}
          DEPS_COMMAND: ${{ inputs.deps-command }}
          ELIXIR_VERSION: ${{ inputs.elixir-version }}
          OTP_VERSION: ${{ inputs.otp-version }}
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          set -eu

          case "${CACHE_EXACT_KEY_HIT:-}" in
            true)
              cache_hit="true"
              ;;
            false)
              cache_hit="false-or-restore-key"
              ;;
            *)
              cache_hit="skipped"
              ;;
          esac

          {
            echo "Elixir CI policy:"
            echo "- runner: ${RUNNER_LABEL}"
            echo "- runner_os: ${RUNNER_OS}"
            echo "- runner_arch: ${RUNNER_ARCH}"
            echo "- otp_version: ${OTP_VERSION}"
            echo "- elixir_version: ${ELIXIR_VERSION}"
            echo "- beam_mode: ${BEAM_MODE}"
            echo "- cache_mode: ${CACHE_MODE}"
            echo "- cache_key: ${CACHE_KEY}"
            echo "- cache_exact_key_hit: ${cache_hit}"
            echo "- deps_command: ${DEPS_COMMAND}"
            echo "- ci_command: ${CI_COMMAND}"
          } | tee /tmp/elixir-ci-policy.txt

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Elixir CI policy"
              echo
              echo '```text'
              cat /tmp/elixir-ci-policy.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure private git deps (SSH)
        if: ${{ env.PRIVATE_DEPS_SSH_KEY != '' }}
        env:
          SSH_KEY: ${{ secrets.private_deps_ssh_key }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/private_deps
          chmod 600 ~/.ssh/private_deps
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host github.com\n  IdentityFile ~/.ssh/private_deps\n  IdentitiesOnly yes\n' >> ~/.ssh/config

      - name: Install deps
        run: ${{ inputs.deps-command }}

      - name: Run CI
        env:
          BEAM_DOWNLOAD_CACHE_HIT: ${{ steps.beam-download-cache.outputs.cache-hit }}
        run: ${{ inputs.ci-command }}
